<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kingdom Journey 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d0d8;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;color:white;text-shadow:0 2px 6px #20343b}.panel{background:#172c37c9;border:1px solid #ffffff35;border-radius:15px;padding:10px 13px;backdrop-filter:blur(10px)}.title{font-size:13px;font-weight:850;letter-spacing:.08em}.sub{font-size:10px;margin-top:3px}#hint{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);border-radius:24px;padding:10px 14px;background:#172c37df;color:white;font-size:12px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}.btn{border:1px solid #ffffff55;border-radius:14px;background:#172c37d9;color:white;font-size:19px;font-weight:800;touch-action:none;box-shadow:0 5px 16px #0003}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:grid;gap:8px;pointer-events:auto}.action{font-size:12px;padding:0 12px;min-width:122px;height:45px}.primary{background:#a9772b}#overlay{display:none;position:fixed;inset:0;background:#07151bc7;backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:20px;color:#20323a}#card{background:#f7f0de;border-radius:22px;padding:23px;max-width:430px;width:100%;box-shadow:0 25px 80px #0005}#card h2{margin:3px 0 12px}#card p{line-height:1.6}#card button{width:100%;padding:12px;background:#203a <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9d0d8');scene.fog=new THREE.Fog('#a9d0d8',40,115);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight('#e8f7ff','#7d7951',2));const sun=new THREE.DirectionalLight('#fff0ce',3);sun.position.set(-18,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.88});
function cube(x,y,z,w,h,d,c){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}

// Procedural earth-and-grass texture: generated locally so no external asset can break startup.

const terrainCtx=terrainCanvas.getContext('2d');terrainCtx.fillStyle='#928d63';terrainCtx.fillRect(0,0,256,256);
let terrainSeed=7341;const terrainRand=()=>{terrainSeed=(terrainSeed*1664525+1013904223)>>>0;return terrainSeed/4294967296};
for(let i=0;i<7200;i++){const x=terrainRand()*256,y=terrainRand()*256,r=.4+terrainRand()*2.8;const colors=['rgba(65,83,47,.18)','rgba(177,157,104,.25)','rgba(213,192,142,.20)','rgba(65,61,43,.12)','rgba(133,139,87,.22)'];terrainCtx.fillStyle=colors[i%colors.length];terrainCtx.beginPath();terrainCtx.ellipse(x,y,r*1.6,r,terrainRand()*Math.PI,0,Math.PI*2);terrainCtx.fill()}
// Broad translucent soil patches break up the repeated ground texture into natural-looking earth and scrub.
for(let i=0;i<46;i++){
  const x=terrainRand()*256,y=terrainRand()*256;
  const rx=5+terrainRand()*18,ry=3+terrainRand()*10;
  const patch=terrainCtx.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  const tint=i%3===0?'rgba(126,91,56,':'rgba(187,169,115,';
  patch.addColorStop(0,tint+(i%3===0?'.22':'.18')+')');
  patch.addColorStop(1,tint+'0)');

const terrainTexture=new THREE.CanvasTexture(terrainCanvas);terrainTexture.wrapS=terrainTexture.wrapT=THREE.RepeatWrapping;terrainTexture.repeat.set(9,9);terrainTexture.colorSpace=THREE.SRGBColorSpace;
const groundMat=new THREE.MeshStandardMaterial({map:terrainTexture,color:'#d0c99a',roughness:1});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150,70,70),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;
const groundPos=ground.geometry.attributes.position;
for(let i=0;i<groundPos.count;i++){
  const x=groundPos.getX(i),z=groundPos.getY(i);
  // Gentle rolling earth, with a little more height variation toward the outer hills.
  const edge=Math.max(0,(Math.abs(x)-12)/24);
  const broad=(Math.sin(x*.075+z*.035)+Math.cos(z*.09-x*.025))*.16;
  const fine=Math.sin((x+z)*.055)*.12+Math.cos(x*.19-z*.12)*.035;
  groundPos.setZ(i,broad+fine+edge*(Math.sin(z*.16+x*.07)*.42+Math.cos(z*.12)*.24));
}
ground.geometry.computeVertexNormals();scene.add(ground);
// Broad, filled mountain masses with a continuous sloping base. Avoid thin mesh ribbons and sharp isolated peaks.
function makeMountainRange(opts){
  const {centerZ,width,depth,baseY,height,color,seed}=opts;
  let s=seed;const rand=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  const nx=100,nz=24,positions=[],indices=[];
  const peaks=[];
  for(let p=0;p<23;p++)peaks.push({x:(rand()-.5)*width*.92,w:7+rand()*14,h:height*(.35+rand()*.65)});
  for(let iz=0;iz<=nz;iz++){
    const v=iz/nz,z=centerZ+(v-.5)*depth;
    for(let ix=0;ix<=nx;ix++){
      const u=ix/nx,x=(u-.5)*width;
      let ridge=0;
      for(const p of peaks){const q=(x-p.x)/p.w;ridge=Math.max(ridge,p.h*Math.exp(-q*q*.8))}
      const broadWave=Math.sin(x*.035+seed)*.65+Math.cos(x*.022-seed*.3)*.5;
      const rough=Math.sin(x*.13+seed)*.18+Math.cos(x*.075+seed*2)*.13;
      // Keep a substantial continuous body, with softened peaks rather than narrow triangular ridges.
      const y=baseY+height*.32+Math.max(0,ridge+ broadWave*height*.12+rough*height*.12);
      positions.push(x,y,z+Math.sin(x*.025+seed)*.4);
    }
  }
  for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){
    const a=iz*(nx+1)+ix,b=a+1,c=a+(nx+1),d=c+1;
    indices.push(a,c,b,b,c,d);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setIndex(indices);geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:1,flatShading:false,side:THREE.DoubleSide}));
  mesh.receiveShadow=true;scene.add(mesh);
  // Wide ellipsoidal foothill fills the entire lower silhouette, hiding any ribbon-like edge.
  const foot=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshStandardMaterial({color,roughness:1,flatShading:false}));
  foot.scale.set(width*.57,height*.72,depth*.95);
  foot.position.set(0,baseY+height*.08,centerZ);
  foot.receiveShadow=true;scene.add(foot);
}
// Atmospheric perspective: far ranges are broad and pale, nearer hills are darker and more defined.
makeMountainRange({centerZ:-94,width:230,depth:23,baseY:-4,height:8,color:'#b0afa6',seed:19});
makeMountainRange({centerZ:-78,width:210,depth:25,baseY:-4.3,height:10,color:'#a09f91',seed:37});
makeMountainRange({centerZ:-61,width:190,depth:27,baseY:-4.7,height:12,color:'#898d7c',seed:53});
makeMountainRange({centerZ:-45,width:170,depth:29,baseY:-5,height:13,color:'#747e67',seed:71});
/* Oversized green mounds removed to keep the playable landscape open. */
const stoneMat=material('#b9b09a');const stoneEdge=material('#8d8876');const stonePts=[[0,13],[.25,10],[.55,7],[1.2,4],[2.4,1],[4,-2],[5.8,-5],[6.8,-8],[6.5,-11],[5.2,-14],[3.4,-17],[1.7,-20],[.5,-23],[0,-26],[0,-28]];stonePts.forEach((p,i)=>{const stone=new THREE.Mesh(new THREE.CylinderGeometry(.72+Math.sin(i*2.3)*.08,.82, .18, 7),i%3===0?stoneEdge:stoneMat);stone.position.set(p[0]+Math.sin(i*1.7)*.38,.055,p[1]);stone.rotation.y=(i%2?-.12:.18);stone.scale.set(1.18,.72,.78);stone.castShadow=true;stone.receiveShadow=true;scene.add(stone)});
for(let i=0;i<12;i++){const x=-24+(i%6)*9,z=-27-Math.floor(i/6)*9;cube(x,1.2,z,3.5,2.4,3,'#d8c6a4');roof(x,3,z,2.6,1.8,'#92684b');cube(x,.7,z+1.55,.7,1.4,.12,'#594333')}
cube(-5,2.2,7,7,4.4,5,'#d8bd91');roof(-5,5.2,7,5.4,3,'#754d38');cube(-5,.95,9.55,1.2,1.9,.14,'#503a2b');cube(-7.1,2.5,9.57,1.1,1.1,.14,'#d4a967');cube(-2.9,2.5,9.57,1.1,1.1,.14,'#d4a967');
cube(4,1.7,-25,5,3.4,4,'#b99a6b');roof(4,4,-25,4,2.4,'#6b4936');cube(4,.35,-22.4,1.3,.45,.6,'#88613f');
for(let i=0;i<45;i++){const x=(Math.random()-.5)*65,z=12-Math.random()*62;if(Math.abs(x)<5&&z<14&&z>-30)continue;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.45),material(i%2?'#858b62':'#aaa17b'));rock.position.set(x,.15,z);rock.scale.y=.6;rock.castShadow=true;scene.add(rock)}
for(let i=0;i<27;i++){const x=(Math.random()-.5)*60,z=10-Math.random()*58;if(Math.abs(x)<6&&z<14&&z>-30)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.1,7),material('#70523a'));trunk.position.set(x,.55,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.95+Math.random()*.5,1),material(i%3?'#66825c':'#7f9561'));crown.position.set(x,1.65,z);crown.scale.set(1.25,.85,1);crown.castShadow=true;scene.add(crown)}
// Sparse dry-grass tufts and weathered pebbles add ground-level detail without blocking the trail.
const grassMats=[material('#858657'),material('#a19a61'),material('#6f7b4b')];
const bladeGeo=new THREE.ConeGeometry(.075,.48,4);
let detailSeed=2197;const detailRand=()=>{detailSeed=(detailSeed*1664525+1013904223)>>>0;return detailSeed/4294967296};
for(let i=0;i<72;i++){
  const x=(detailRand()-.5)*68,z=14-detailRand()*63;
  // Leave the inn entrance, stepping-stone route, and nearby interaction areas open.
  const trailX=z>7?0:z>-2?1.4:z>-14?5.5:z>-23?2.2:0;
  if(Math.abs(x-trailX)<3.2 || (Math.abs(x+5)<4&&z>7&&z<13) || (Math.abs(x-8)<3&&z>-11&&z<-3) || (Math.abs(x-4)<4&&z>-29&&z<-21)) continue;
  const tuft=new THREE.Group();tuft.position.set(x,.02,z);
  for(let b=0;b<3;b++){const blade=new THREE.Mesh(bladeGeo,grassMats[(i+b)%grassMats.length]);blade.position.set((b-1)*.09,.22,((b%2)-.5)*.1);blade.rotation.z=(b-1)*.32;blade.rotation.x=(b-1)*.12;tuft.add(blade)}
  scene.add(tuft);
}
const pebbleGeo=new THREE.DodecahedronGeometry(.22,0);
const pebbleMats=[material('#aaa18b'),material('#8c8979'),material('#c0b49a')];
for(let i=0;i<38;i++){
  const x=(detailRand()-.5)*70,z=12-detailRand()*64;
  if(Math.abs(x)<4.2&&z<14&&z>-30)continue;
  const pebble=new THREE.Mesh(pebbleGeo,pebbleMats[i%pebbleMats.length]);
  pebble.position.set(x,.08,z);pebble.scale.set(.65+detailRand()*.8,.35+detailRand()*.3,.55+detailRand()*.7);
  pebble.rotation.set(detailRand()*.3,detailRand()*Math.PI,detailRand()*.2);pebble.castShadow=true;scene.add(pebble);
}
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.8,5,10),material('#36556b'));body.position.y=1.2;body.castShadow=true;player.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),material('#c58d67'));head.position.y=2.05;head.castShadow=true;player.add(head);const hood=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12,0,Math.PI*2,0,Math.PI*.58),material('#d8c59c'));hood.position.y=2.15;player.add(hood);const pack=new THREE.Mesh(new THREE.BoxGeometry(.45,.52,.25),material('#875b3d'));pack.position.set(0,1.23,-.4);player.add(pack);const legs=[];for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.48,3,7),material('#594a3d'));leg.position.set(side*.2,.42,0);player.add(leg);legs.push(leg)}player.position.set(-5,0,12);
function npc(x,z,color,kind){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,9),material(color));torso.position.y=1.1;g.add(torso);const h=new THREE.Mesh(new THREE.SphereGeometry(.31,14,10),material('#b98765'));h.position.y=1.9;g.add(h);const wrap=new THREE.Mesh(new THREE.SphereGeometry(.35,14,10,0,Math.PI*2,0,Math.PI*.55),material('#e3d2b2'));wrap.position.y=2;g.add(wrap);g.userData.kind=kind;return g}
const shepherd=npc(8,-7,'#8e6749','shepherd');
for(let i=0;i<7;i++){const sheep=new THREE.Group(),x=10+(i%3)*2,z=-5-Math.floor(i/3)*3;const wool=new THREE.Mesh(new THREE.SphereGeometry(.48,12,9),material('#eee9dc'));wool.scale.set(1.3,.8,.85);wool.position.y=.65;sheep.add(wool);const face=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),material('#534d43'));face.position.set(.45,.65,.05);sheep.add(face);sheep.position.set(x,0,z);scene.add(sheep)}
const keys={up:false,down:false,left:false,right:false};let running=false,xp=0,modal=false;const hint=document.getElementById('hint');
function card(title,copy){modal=true;document.getElementById('card').innerHTML='<h2>'+title+'</h2><p>'+copy+'</p><button id="closeCard">Continue exploring</button>';document.getElementById('overlay').style.display='flex';document.getElementById('closeCard').onclick=()=>{modal=false;document.getElementById('overlay').style.display='none'}}
function interact(){if(modal)return;const d=Math.hypot(player.position.x-shepherd.position.x,player.position.z-shepherd.position.z);if(d<3.4){card('Good news in Bethlehem','Luke 2:8–20 tells how an angel appeared to shepherds and announced good news of great joy. The shepherd invites you to read the story and carry its message onward.');xp+=25;document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=1+Math.floor(xp/50)}else if(Math.hypot(player.position.x+5,player.position.z-7)<3.8){card('Welcome to the Inn','May your road be peaceful. Your satchel is ready, and the hills of Bethlehem await beyond the door.')}else if(Math.hypot(player.position.x-4,player.position.z+25)<3.8){card('A sign in the manger','You have reached the stable. Read Luke 2:12–16 and reflect on the sign given to the shepherds.');xp+=30;document.getElementById('xp').textContent=xp}else hint.textContent='Move closer to the inn, shepherd, or manger to interact.'}
document.getElementById('interact').onclick=interact;document.getElementById('run').onclick=()=>{running=!running;document.getElementById('run').textContent='🏃 RUN: '+(running?'ON':'OFF')};
document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;const down=e=>{e.preventDefault();keys[d]=true;try{b.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();keys[d]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',()=>{keys[d]=false})});
// Safety release: if the finger slips off a control or the browser interrupts touch input, stop all movement.
const releaseMovement=()=>{keys.up=false;keys.down=false;keys.left=false;keys.right=false};
addEventListener('pointerup',releaseMovement);addEventListener('pointercancel',releaseMovement);addEventListener('blur',releaseMovement);document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseMovement()});
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.key===' '||e.key==='Enter')interact()});addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
const clock=new THREE.Clock(),offset=new THREE.Vector3(0,6.5,10);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!modal){let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0);if(dx||dz){const m=Math.hypot(dx,dz);dx/=m;dz/=m;const pace=(running?7:3.8)*dt;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*pace,-35,35);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*pace,-40,20);player.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(clock.elapsedTime*10)*(running?.45:.22);legs[0].rotation.x=swing;legs[1].rotation.x=-swing;body.position.y=1.2+Math.abs(swing)*.06}else legs.forEach(l=>l.rotation.x=0)}const target=player.position.clone().add(new THREE.Vector3(0,1.2,0)),desired=target.clone().add(offset.clone().applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y*.25));camera.position.lerp(desired,.09);camera.lookAt(target.clone().add(new THREE.Vector3(0,.25,-2)));renderer.render(scene,camera);hint.textContent=Math.hypot(player.position.x-shepherd.position.x,player.position.z-shepherd.position.z)<3.4?'Tap TALK / INTERACT to speak with the shepherd.':'Explore the hills beyond the inn. Use the arrows to move.'}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kingdom Journey 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9d0d8;font-family:system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;color:white;text-shadow:0 2px 6px #20343b}.panel{background:#172c37c9;border:1px solid #ffffff35;border-radius:15px;padding:10px 13px;backdrop-filter:blur(10px)}.title{font-size:13px;font-weight:850;letter-spacing:.08em}.sub{font-size:10px;margin-top:3px}#hint{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);border-radius:24px;padding:10px 14px;background:#172c37df;color:white;font-size:12px;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}#controls{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}.btn{border:1px solid #ffffff55;border-radius:14px;background:#172c37d9;color:white;font-size:19px;font-weight:800;touch-action:none;box-shadow:0 5px 16px #0003}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:grid;gap:8px;pointer-events:auto}.action{font-size:12px;padding:0 12px;min-width:122px;height:45px}.primary{background:#a9772b}#overlay{display:none;position:fixed;inset:0;background:#07151bc7;backdrop-filter:blur(7px);align-items:center;justify-content:center;padding:20px;color:#20323a}#card{background:#f7f0de;border-radius:22px;padding:23px;max-width:430px;width:100%;box-shadow:0 25px 80px #0005}#card h2{margin:3px 0 12px}#card p{line-height:1.6}#card button{width:100%;padding:12px;background:#203a42;color:white;border:0;border-radius:12px;font-weight:800}@media(min-width:700px){.pad{grid-template-columns:58px 58px 58px;grid-template-rows:58px 58px}.action{min-width:145px;height:50px}}</style></head><body><div id="errorNotice" style="display:none;position:fixed;top:70px;left:12px;right:12px;z-index:99;background:#641f1f;color:white;padding:12px;border-radius:10px;font-size:13px"></div><script>window.addEventListener('error',e=>{const n=document.getElementById('errorNotice');if(n){n.style.display='block';n.textContent='Game error: '+(e.message||'Unknown error')}});window.addEventListener('unhandledrejection',e=>{const n=document.getElementById('errorNotice');if(n){n.style.display='block';n.textContent='Game loading error: '+String(e.reason||'Unknown error')}});</script><div id="hud"><div class="panel"><div class="title">✦ KINGDOM JOURNEY</div><div class="sub">A HISTORICALLY INSPIRED BIBLICAL WORLD</div></div><div class="panel">⭐ Level <span id="level">1</span><br>✨ XP <span id="xp">0</span></div></div><div id="hint">Explore the hills beyond the inn.</div><div id="controls"><div class="pad"><button class="btn up" data-dir="up">▲</button><button class="btn left" data-dir="left">◀</button><button class="btn down" data-dir="down">▼</button><button class="btn right" data-dir="right">▶</button></div><div class="actions"><button class="btn action" id="run">🏃 RUN: OFF</button><button class="btn action primary" id="interact">TALK / INTERACT</button></div></div><div id="overlay"><div id="card"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color('#a9d0d8');scene.fog=new THREE.Fog('#a9d0d8',40,115);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight('#e8f7ff','#7d7951',2));const sun=new THREE.DirectionalLight('#fff0ce',3);sun.position.set(-18,30,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-35;sun.shadow.camera.right=35;sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.88});
function cube(x,y,z,w,h,d,c){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function roof(x,y,z,r,h,c){const o=new THREE.Mesh(new THREE.ConeGeometry(r,h,4),material(c));o.rotation.y=Math.PI/4;o.position.set(x,y,z);o.castShadow=true;scene.add(o)}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,150),material('#a5ad78'));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);
/* Oversized green mounds removed to keep the playable landscape open. */
const stoneMat=material('#b9b09a');const stoneEdge=material('#8d8876');const stonePts=[[0,13],[.25,10],[.55,7],[1.2,4],[2.4,1],[4,-2],[5.8,-5],[6.8,-8],[6.5,-11],[5.2,-14],[3.4,-17],[1.7,-20],[.5,-23],[0,-26],[0,-28]];stonePts.forEach((p,i)=>{const stone=new THREE.Mesh(new THREE.CylinderGeometry(.72+Math.sin(i*2.3)*.08,.82, .18, 7),i%3===0?stoneEdge:stoneMat);stone.position.set(p[0]+Math.sin(i*1.7)*.38,.055,p[1]);stone.rotation.y=(i%2?-.12:.18);stone.scale.set(1.18,.72,.78);stone.castShadow=true;stone.receiveShadow=true;scene.add(stone)});
for(let i=0;i<12;i++){const x=-24+(i%6)*9,z=-27-Math.floor(i/6)*9;cube(x,1.2,z,3.5,2.4,3,'#d8c6a4');roof(x,3,z,2.6,1.8,'#92684b');cube(x,.7,z+1.55,.7,1.4,.12,'#594333')}
cube(-5,2.2,7,7,4.4,5,'#d8bd91');roof(-5,5.2,7,5.4,3,'#754d38');cube(-5,.95,9.55,1.2,1.9,.14,'#503a2b');cube(-7.1,2.5,9.57,1.1,1.1,.14,'#d4a967');cube(-2.9,2.5,9.57,1.1,1.1,.14,'#d4a967');
cube(4,1.7,-25,5,3.4,4,'#b99a6b');roof(4,4,-25,4,2.4,'#6b4936');cube(4,.35,-22.4,1.3,.45,.6,'#88613f');
for(let i=0;i<45;i++){const x=(Math.random()-.5)*65,z=12-Math.random()*62;if(Math.abs(x)<5&&z<14&&z>-30)continue;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.25+Math.random()*.45),material(i%2?'#858b62':'#aaa17b'));rock.position.set(x,.15,z);rock.scale.y=.6;rock.castShadow=true;scene.add(rock)}
for(let i=0;i<27;i++){const x=(Math.random()-.5)*60,z=10-Math.random()*58;if(Math.abs(x)<6&&z<14&&z>-30)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.2,1.1,7),material('#70523a'));trunk.position.set(x,.55,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.95+Math.random()*.5,1),material(i%3?'#66825c':'#7f9561'));crown.position.set(x,1.65,z);crown.scale.set(1.25,.85,1);crown.castShadow=true;scene.add(crown)}
function makeHuman({skin='#ad7655',robe='#6f7652',hair='#3d3028',headWrap=null,pack=false}={}){
 const g=new THREE.Group();
 const cloth=material(robe),skinMat=material(skin),hairMat=material(hair),leather=material('#68472f');
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.72,6,12),cloth);torso.position.y=1.16;torso.scale.set(1.12,1.05,.72);torso.castShadow=true;g.add(torso);
 const skirt=new THREE.Mesh(new THREE.CylinderGeometry(.43,.52,.62,12),cloth);skirt.position.y=.65;skirt.castShadow=true;g.add(skirt);
 const neck=new THREE.Mesh(new THREE.CylinderGeometry(.105,.13,.2,10),skinMat);neck.position.y=1.73;g.add(neck);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.285,20,16),skinMat);head.position.y=1.98;head.scale.set(.92,1.08,.94);head.castShadow=true;g.add(head);
 const earGeo=new THREE.SphereGeometry(.065,10,8);for(const side of [-1,1]){const ear=new THREE.Mesh(earGeo,skinMat);ear.position.set(side*.275,1.97,0);g.add(ear)}
 const nose=new THREE.Mesh(new THREE.SphereGeometry(.055,10,8),skinMat);nose.position.set(0,1.96,.27);nose.scale.set(.7,1.25,.8);g.add(nose);
 const eyeMat=material('#342821');for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.026,8,8),eyeMat);eye.position.set(side*.105,2.025,.248);g.add(eye)}
 const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12,0,Math.PI*2,0,Math.PI*.58),headWrap?material(headWrap):hairMat);hairCap.position.y=2.12;g.add(hairCap);
 if(!headWrap){const hairBack=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),hairMat);hairBack.position.set(0,1.96,-.09);hairBack.scale.set(1,1,.65);g.add(hairBack)}
 const arms=[],hands=[],legs=[];
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.115,.48,4,9),cloth);arm.position.set(side*.43,1.18,0);arm.rotation.z=side*-.16;arm.castShadow=true;g.add(arm);arms.push(arm);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.105,10,8),skinMat);hand.position.set(side*.48,.84,.025);g.add(hand);hands.push(hand);
  const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.115,.43,4,8),material('#66503d'));leg.position.set(side*.19,.29,0);leg.castShadow=true;g.add(leg);legs.push(leg);
  const sandal=new THREE.Mesh(new THREE.BoxGeometry(.23,.075,.36),leather);sandal.position.set(side*.19,.075,.07);g.add(sandal);
 }
 const belt=new THREE.Mesh(new THREE.TorusGeometry(.31,.035,6,18),leather);belt.rotation.x=Math.PI/2;belt.position.y=.89;g.add(belt);
 if(pack){const sack=new THREE.Mesh(new THREE.BoxGeometry(.38,.46,.23),leather);sack.position.set(0,1.22,-.32);sack.castShadow=true;g.add(sack);const strap=new THREE.Mesh(new THREE.BoxGeometry(.07,.78,.045),material('#b08b5d'));strap.position.set(.18,1.25,-.25);strap.rotation.z=-.18;g.add(strap)}
 g.userData={legs,arms,torso};return g;
}
const player=makeHuman({skin:'#9c684b',robe:'#526d80',hair:'#30251f',headWrap:'#d8c59c',pack:true});scene.add(player);player.position.set(-5,0,12);
const legs=player.userData.legs,arms=player.userData.arms,body=player.userData.torso;
function npc(x,z,color,kind){const palette={'#8e6749':{skin:'#875a42',hair:'#33261f',wrap:'#cbb58c'},'#9b7350':{skin:'#b47c5c',hair:'#473127',wrap:'#e0d2b4'}};const p=palette[color]||{skin:'#a97858',hair:'#382b23',wrap:'#d8c7a4'};const g=makeHuman({skin:p.skin,robe:color,hair:p.hair,headWrap:p.wrap});g.position.set(x,0,z);scene.add(g);g.userData.kind=kind;return g}
const shepherd=npc(8,-7,'#8e6749','shepherd');
window.kingdomShepherd=shepherd;
for(let i=0;i<7;i++){const sheep=new THREE.Group(),x=10+(i%3)*2,z=-5-Math.floor(i/3)*3;const wool=new THREE.Mesh(new THREE.SphereGeometry(.48,12,9),material('#eee9dc'));wool.scale.set(1.3,.8,.85);wool.position.y=.65;sheep.add(wool);const face=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),material('#534d43'));face.position.set(.45,.65,.05);sheep.add(face);sheep.position.set(x,0,z);scene.add(sheep)}
const keys={up:false,down:false,left:false,right:false};let running=false,xp=0,modal=false;const hint=document.getElementById('hint');
function card(title,copy){modal=true;document.getElementById('card').innerHTML='<h2>'+title+'</h2><p>'+copy+'</p><button id="closeCard">Continue exploring</button>';document.getElementById('overlay').style.display='flex';document.getElementById('closeCard').onclick=()=>{modal=false;document.getElementById('overlay').style.display='none'}}
function interact(){if(modal)return;const activeShepherd=window.kingdomShepherd||shepherd;const d=Math.hypot(player.position.x-activeShepherd.position.x,player.position.z-activeShepherd.position.z);if(d<3.4){card('Good news in Bethlehem','Luke 2:8–20 tells how an angel appeared to shepherds and announced good news of great joy. The shepherd invites you to read the story and carry its message onward.');xp+=25;document.getElementById('xp').textContent=xp;document.getElementById('level').textContent=1+Math.floor(xp/50)}else if(Math.hypot(player.position.x+5,player.position.z-7)<3.8){card('Welcome to the Inn','May your road be peaceful. Your satchel is ready, and the hills of Bethlehem await beyond the door.')}else if(Math.hypot(player.position.x-4,player.position.z+25)<3.8){card('A sign in the manger','You have reached the stable. Read Luke 2:12–16 and reflect on the sign given to the shepherds.');xp+=30;document.getElementById('xp').textContent=xp}else hint.textContent='Move closer to the inn, shepherd, or manger to interact.'}
document.getElementById('interact').onclick=interact;document.getElementById('run').onclick=()=>{running=!running;document.getElementById('run').textContent='🏃 RUN: '+(running?'ON':'OFF')};
document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;const down=e=>{e.preventDefault();keys[d]=true},up=e=>{e.preventDefault();keys[d]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.key===' '||e.key==='Enter')interact()});addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
const clock=new THREE.Clock(),offset=new THREE.Vector3(0,6.5,10);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04);if(!modal){let dx=(keys.right?1:0)-(keys.left?1:0),dz=(keys.down?1:0)-(keys.up?1:0);if(dx||dz){const m=Math.hypot(dx,dz);dx/=m;dz/=m;const pace=(running?7:3.8)*dt;player.position.x=THREE.MathUtils.clamp(player.position.x+dx*pace,-35,35);player.position.z=THREE.MathUtils.clamp(player.position.z+dz*pace,-40,20);player.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(clock.elapsedTime*10)*(running?.45:.22);legs[0].rotation.x=swing;legs[1].rotation.x=-swing;arms[0].rotation.x=-swing*.7;arms[1].rotation.x=swing*.7;body.position.y=1.16+Math.abs(swing)*.04}else {legs.forEach(l=>l.rotation.x=0);arms.forEach(a=>a.rotation.x=0)}}const target=player.position.clone().add(new THREE.Vector3(0,1.2,0)),desired=target.clone().add(offset.clone().applyAxisAngle(new THREE.Vector3(0,1,0),player.rotation.y*.25));camera.position.lerp(desired,.09);camera.lookAt(target.clone().add(new THREE.Vector3(0,.25,-2)));renderer.render(scene,camera);hint.textContent=Math.hypot(player.position.x-(window.kingdomShepherd||shepherd).position.x,player.position.z-(window.kingdomShepherd||shepherd).position.z)<3.4?'Tap TALK / INTERACT to speak with the shepherd.':'Explore the hills beyond the inn. Use the arrows to move.'}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#182b35">
<title>Kingdom Journey | Free Browser Prototype</title>
<style>
:root{--ink:#f8f4e9;--gold:#f5c96b;--panel:rgba(14,29,36,.92);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182b35;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:2;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.brand,.stats{background:rgba(14,29,36,.8);border:1px solid var(--line);border-radius:14px;padding:9px 12px;backdrop-filter:blur(6px)}
.brand strong{display:block;font-size:14px;letter-spacing:.04em}.brand small{opacity:.8;font-size:11px}
.stats{font-size:12px;text-align:right;min-width:100px;line-height:1.6}
#quest{position:absolute;z-index:2;top:88px;left:12px;max-width:min(320px,calc(100% - 24px));background:rgba(14,29,36,.78);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.4;pointer-events:none}
#quest b{color:var(--gold);display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
#minimap{position:absolute;z-index:2;right:12px;top:126px;width:116px;height:84px;border-radius:12px;border:1px solid var(--line);background:rgba(14,29,36,.8);opacity:.95}
#hint{position:absolute;z-index:2;left:50%;transform:translateX(-50%);bottom:150px;background:rgba(14,29,36,.86);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:12px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.controls{position:absolute;z-index:3;inset:auto 0 0;display:flex;justify-content:space-between;align-items:flex-end;padding:16px;gap:12px;pointer-events:none}
.pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px;gap:5px;pointer-events:auto}
.ctrl,.action{border:1px solid rgba(255,255,255,.24);background:rgba(15,31,38,.72);color:#fff;border-radius:14px;font-size:20px;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none;box-shadow:0 5px 16px rgba(0,0,0,.16)}
.ctrl:active,.action:active{background:rgba(245,201,107,.35)}
.ctrl[data-dir=up]{grid-column:2;grid-row:1}.ctrl[data-dir=left]{grid-column:1;grid-row:2}.ctrl[data-dir=down]{grid-column:2;grid-row:2}.ctrl[data-dir=right]{grid-column:3;grid-row:2}
.actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-end}
.action{font-size:12px;font-weight:700;letter-spacing:.03em;padding:0 15px;min-height:48px;min-width:112px;border-radius:16px}
.action.primary{background:rgba(191,139,45,.9);border-color:rgba(255,235,177,.6)}
#overlay{position:absolute;z-index:5;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,15,20,.76);backdrop-filter:blur(5px)}
.card{width:min(500px,100%);max-height:90%;overflow:auto;background:#f6f0df;color:#21343a;border-radius:22px;padding:22px;box-shadow:0 20px 80px rgba(0,0,0,.35)}
.card h1,.card h2{margin:0 0 10px;line-height:1.15}.card h1{font-size:25px}.card h2{font-size:21px}.card p{line-height:1.55;margin:10px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8b6322;margin-bottom:8px}
.choice{width:100%;display:block;text-align:left;border:1px solid #d4c9af;border-radius:12px;background:#fffaf0;color:#21343a;padding:13px 14px;margin:8px 0;font:inherit}
.choice:active{background:#f5e3b7}.choice.correct{border-color:#47845a;background:#e7f5e7}.choice.wrong{border-color:#b64a3c;background:#fbe8e3}
.bottomrow{display:flex;gap:8px;margin-top:16px}.bottomrow button{flex:1;border:0;border-radius:12px;background:#203a42;color:white;padding:13px;font-weight:700;font-size:14px}
.bottomrow button.secondary{background:#ded3bc;color:#21343a}
#toast{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(14,29,36,.94);border:1px solid var(--gold);border-radius:14px;padding:15px 18px;max-width:85%;text-align:center;display:none}
@media(min-width:760px){.controls{padding:22px 28px}.pad{grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px}.ctrl{font-size:23px}.action{min-width:132px}.brand strong{font-size:16px}#quest{font-size:13px}#minimap{width:150px;height:108px;top:118px;right:16px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Kingdom Journey game world"></canvas>
<div class="hud">
  <div class="brand"><strong>✦ KINGDOM JOURNEY</strong><small>A Bible adventure prototype</small></div>
  <div class="stats"><div>⭐ Level <span id="level">1</span></div><div>✨ XP <span id="xp">0</span></div><div>📜 Scrolls <span id="scrolls">0</span>/3</div></div>
</div>
<div id="quest"><b>Current Quest</b><span id="questText">Find the shepherd near the hillside.</span></div>
<canvas id="minimap" aria-label="Mini map showing your position" width="150" height="108"></canvas>
<div id="hint">Explore the hillside. Use the arrows to move.</div>
<div class="controls">
  <div class="pad" aria-label="Movement controls">
    <button class="ctrl" data-dir="up" aria-label="Move forward">▲</button>
    <button class="ctrl" data-dir="left" aria-label="Move left">◀</button>
    <button class="ctrl" data-dir="down" aria-label="Move back">▼</button>
    <button class="ctrl" data-dir="right" aria-label="Move right">▶</button>
  </div>
  <div class="actions">
    <button id="run" class="action">🏃 WALK</button>
    <button id="interact" class="action primary">TALK / INTERACT</button>
    <button id="inventory" class="action">🎒 INVENTORY</button>
    <button id="journal" class="action">📖 JOURNAL</button>
  </div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<div id="toast"></div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const mapCanvas=document.getElementById('minimap'),mapCtx=mapCanvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1, last=0, toastTimer=0;
const keys={up:false,down:false,left:false,right:false};
const player={x:0,y:0,speed:3.2,dir:0};
const world={w:1000,h:720};
const inn={x:350,y:430};
let xp=0,scrolls=0,quizDone=false,questDone=false,mangerDone=false,interacting=false,running=false;
const saved=(()=>{try{return JSON.parse(localStorage.getItem('kj-free-save')||'{}')}catch(e){return {}}})();
xp=Number(saved.xp)||0;scrolls=Number(saved.scrolls)||0;quizDone=!!saved.quizDone;questDone=!!saved.questDone;mangerDone=!!saved.mangerDone;
player.x=Number.isFinite(saved.x)?saved.x:inn.x+28;player.y=Number.isFinite(saved.y)?saved.y:inn.y+10;
const shepherd={x:635,y:310};
const manger={x:760,y:220};
const market={x:250,y:455};
let inventory=Array.isArray(saved.inventory)?saved.inventory:[];
let equipped=Array.isArray(saved.equipped)?saved.equipped.slice():inventory.slice();
const inventorySlotCount=8;
const scrollItems=[{x:260,y:330,got:false},{x:800,y:430,got:false},{x:430,y:570,got:false}];
scrollItems.forEach((s,i)=>s.got=!!(saved.got&&saved.got[i]));
function save(){try{localStorage.setItem('kj-free-save',JSON.stringify({xp,scrolls,quizDone,questDone,mangerDone,inventory,equipped,x:player.x,y:player.y,got:scrollItems.map(s=>s.got)}))}catch(e){} updateHud()}
function updateHud(){
 $('xp').textContent=xp;$('level').textContent=1+Math.floor(xp/50);$('scrolls').textContent=scrolls;
 $('questText').textContent=mangerDone?'Chapter 2 complete! Keep exploring Bethlehem.':quizDone&&scrolls>=3?'Chapter 2: Follow the star to the manger.':quizDone?'Collect the three Scripture scrolls around the hillside.':'Find the shepherd and learn about the announcement.';
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function project(x,y){const scale=Math.min(W/900,H/650);return {x:W/2+(x-player.x)*scale,y:H*.53+(y-player.y)*scale,scale}}
function drawEllipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill()}
function drawMiniMap(){
 const mw=mapCanvas.width,mh=mapCanvas.height;
 mapCtx.clearRect(0,0,mw,mh);
 mapCtx.fillStyle='#9ba477';mapCtx.fillRect(0,0,mw,mh);
 mapCtx.strokeStyle='#d8c69a';mapCtx.lineWidth=7;mapCtx.beginPath();
 mapCtx.moveTo(8,mh-10);mapCtx.lineTo(35,mh-32);mapCtx.lineTo(63,mh-26);mapCtx.lineTo(84,42);mapCtx.lineTo(112,28);mapCtx.stroke();
 mapCtx.fillStyle='#986e50';mapCtx.fillRect(14,19,9,7);mapCtx.fillRect(30,24,8,7);mapCtx.fillRect(126,18,9,7);
 scrollItems.forEach(it=>{if(!it.got){mapCtx.fillStyle='#f2d06c';mapCtx.beginPath();mapCtx.arc(it.x/world.w*mw,it.y/world.h*mh,3.5,0,Math.PI*2);mapCtx.fill()}});
 mapCtx.fillStyle=(quizDone&&scrolls>=3)?'#ffe78a':'#b6b6a1';mapCtx.beginPath();mapCtx.arc(manger.x/world.w*mw,manger.y/world.h*mh,4,0,Math.PI*2);mapCtx.fill();
 mapCtx.fillStyle='#f5f0d8';mapCtx.beginPath();mapCtx.arc(shepherd.x/world.w*mw,shepherd.y/world.h*mh,4,0,Math.PI*2);mapCtx.fill();
 mapCtx.fillStyle='#254b70';mapCtx.beginPath();mapCtx.arc(player.x/world.w*mw,player.y/world.h*mh,4.5,0,Math.PI*2);mapCtx.fill();
 mapCtx.strokeStyle='rgba(255,255,255,.5)';mapCtx.lineWidth=1;mapCtx.strokeRect(.5,.5,mw-1,mh-1);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#8bb9c2');sky.addColorStop(.52,'#d5c99d');sky.addColorStop(1,'#9d9a62');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // distant ridges
 ctx.fillStyle='#6e958b';ctx.beginPath();ctx.moveTo(0,H*.42);for(let x=0;x<=W;x+=80)ctx.lineTo(x,H*.30+Math.sin(x*.012)*32+Math.cos(x*.022)*15);ctx.lineTo(W,H*.6);ctx.lineTo(0,H*.6);ctx.fill();
 ctx.fillStyle='#b7b17b';ctx.fillRect(0,H*.47,W,H*.53);
 // world objects in a simple pseudo-3D angled landscape
 const s=Math.min(W/900,H/650);
 function point(x,y){return {x:W/2+(x-player.x)*s,y:H*.53+(y-player.y)*s}}
 // winding path
 ctx.strokeStyle='#d8c69a';ctx.lineWidth=60*s;ctx.lineCap='round';ctx.beginPath();let path=[[100,610],[240,520],[360,545],[480,455],[600,450],[700,370],[880,350]];path.forEach((p,i)=>{let q=point(...p);if(!i)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.stroke();
 // stones and shrubs
 for(let i=0;i<32;i++){let x=(i*137+70)%world.w,y=(i*89+95)%world.h,q=point(x,y);if(q.x<-30||q.x>W+30||q.y<-30||q.y>H+30)continue;drawEllipse(q.x,q.y,7*s,4*s,i%2?'#667d55':'#7d8756');drawEllipse(q.x-2*s,q.y-2*s,3*s,2*s,'#98a16a')}
 // small Bethlehem-style houses far away
 const houses=[[150,280],[205,295],[850,275],[890,300]];
 houses.forEach(([x,y],i)=>{let q=point(x,y);let z=s*(i%2?0.8:1);ctx.fillStyle='#d9c5a0';ctx.fillRect(q.x-19*z,q.y-24*z,38*z,27*z);poly([[q.x-24*z,q.y-24*z],[q.x,q.y-44*z],[q.x+24*z,q.y-24*z]],'#986e50');ctx.fillStyle='#6c5a48';ctx.fillRect(q.x-4*z,q.y-13*z,8*z,16*z)});
 // Bethlehem market stall
 {let q=point(market.x,market.y),z=s;
  ctx.fillStyle='#79543b';ctx.fillRect(q.x-31*z,q.y-15*z,5*z,31*z);ctx.fillRect(q.x+26*z,q.y-15*z,5*z,31*z);
  ctx.fillStyle='#d6b66f';ctx.fillRect(q.x-36*z,q.y-22*z,72*z,9*z);
  poly([[q.x-39*z,q.y-22*z],[q.x-25*z,q.y-43*z],[q.x-10*z,q.y-22*z],[q.x+5*z,q.y-43*z],[q.x+20*z,q.y-22*z],[q.x+35*z,q.y-43*z],[q.x+39*z,q.y-22*z]],'#a84e3d');
  ctx.fillStyle='#f6e5b8';ctx.font=`${Math.max(10,12*z)}px system-ui`;ctx.textAlign='center';ctx.fillText("BETHLEHEM MARKET",q.x,q.y-50*z);
  ctx.fillStyle='#8b623e';ctx.fillRect(q.x-22*z,q.y-7*z,44*z,9*z);
  ['#d1a94f','#7f9b78','#c37b5c'].forEach((col,i)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(q.x+(-14+i*14)*z,q.y-13*z,5*z,0,Math.PI*2);ctx.fill()})
 }
 // the inn where each journey begins
 {let q=point(inn.x,inn.y),z=s;
  ctx.fillStyle='#c8b18a';ctx.fillRect(q.x-38*z,q.y-31*z,76*z,43*z);
  poly([[q.x-46*z,q.y-31*z],[q.x,q.y-59*z],[q.x+46*z,q.y-31*z]],'#76513a');
  ctx.fillStyle='#4c382b';ctx.fillRect(q.x-10*z,q.y-20*z,20*z,32*z);
  ctx.fillStyle='#e9d8b4';ctx.fillRect(q.x-29*z,q.y-20*z,12*z,13*z);ctx.fillRect(q.x+17*z,q.y-20*z,12*z,13*z);
  ctx.fillStyle='#fff3c6';ctx.font=`${Math.max(10,12*z)}px system-ui`;ctx.textAlign='center';ctx.fillText('THE INN',q.x,q.y-66*z)
 }
 // Bethlehem stable and manger, destination of Chapter 2
 {let q=point(manger.x,manger.y),z=s;
  ctx.fillStyle='#8b6649';ctx.fillRect(q.x-34*z,q.y-25*z,6*z,48*z);ctx.fillRect(q.x+28*z,q.y-25*z,6*z,48*z);
  poly([[q.x-43*z,q.y-25*z],[q.x,q.y-54*z],[q.x+43*z,q.y-25*z]],'#76513a');
  ctx.fillStyle='#d8c39b';ctx.fillRect(q.x-27*z,q.y-24*z,54*z,7*z);ctx.fillStyle='#e4d2ad';ctx.fillRect(q.x-13*z,q.y-10*z,26*z,7*z);ctx.fillStyle='#9b7048';ctx.fillRect(q.x-17*z,q.y-7*z,34*z,9*z);drawEllipse(q.x,q.y-13*z,7*z,4*z,'#f8edce');
  if(quizDone&&scrolls>=3){ctx.fillStyle='#ffe78a';ctx.beginPath();for(let k=0;k<10;k++){let a=-Math.PI/2+k*Math.PI/5,r=(k%2?7:15)*z,xx=q.x+Math.cos(a)*r,yy=q.y-70*z+Math.sin(a)*r;if(k===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.closePath();ctx.fill();ctx.fillStyle='#fff3c6';ctx.font=`${Math.max(10,12*z)}px system-ui`;ctx.textAlign='center';ctx.fillText('FOLLOW THE STAR',q.x,q.y-91*z)}
  ctx.fillStyle='#fff3c6';ctx.font=`${Math.max(10,12*z)}px system-ui`;ctx.textAlign='center';ctx.fillText('THE MANGER',q.x,q.y-60*z)
 }
 // sheep
 [[560,350],[585,375],[710,340],[740,385],[680,410]].forEach(([x,y],i)=>{let q=point(x,y),z=s*(.65+(i%3)*.08);drawEllipse(q.x,q.y+3*z,12*z,8*z,'#e9e5d6');drawEllipse(q.x+8*z,q.y,5*z,5*z,'#494b43');drawEllipse(q.x-4*z,q.y-3*z,5*z,4*z,'#fffaf0')});
 // scrolls
 scrollItems.forEach((it,i)=>{if(it.got)return;let q=point(it.x,it.y);let bob=Math.sin(performance.now()/280+i)*3;ctx.save();ctx.translate(q.x,q.y-17*s+bob);ctx.rotate(Math.sin(performance.now()/500+i)*.08);ctx.fillStyle='#f4d47a';ctx.fillRect(-7*s,-10*s,14*s,20*s);ctx.fillStyle='#8d6534';ctx.fillRect(-7*s,-10*s,3*s,20*s);ctx.fillRect(4*s,-10*s,3*s,20*s);ctx.restore();ctx.fillStyle='#fff3c6';ctx.font=`${Math.max(10,12*s)}px system-ui`;ctx.textAlign='center';ctx.fillText('📜',q.x,q.y-24*s)});
 // shepherd
 {let q=point(shepherd.x,shepherd.y),z=s;drawEllipse(q.x,q.y+9*z,13*z,5*z,'rgba(32,45,33,.22)');ctx.fillStyle='#8e5d40';ctx.fillRect(q.x-8*z,q.y-20*z,16*z,27*z);drawEllipse(q.x,q.y-25*z,8*z,8*z,'#9d704e');ctx.fillStyle='#e4d5b5';ctx.beginPath();ctx.arc(q.x,q.y-28*z,10*z,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#4e4439';ctx.fillRect(q.x+8*z,q.y-10*z,3*z,23*z);ctx.fillStyle='#fff3c6';ctx.font=`${Math.max(11,13*z)}px system-ui`;ctx.textAlign='center';ctx.fillText('SHEPHERD',q.x,q.y-43*z)}
 // player, centered-ish in camera view
 {let q=point(player.x,player.y),z=s;if(equipped.includes('lantern')){const glow=ctx.createRadialGradient(q.x,q.y-10*z,2*z,q.x,q.y-10*z,58*z);glow.addColorStop(0,'rgba(255,222,120,.32)');glow.addColorStop(1,'rgba(255,222,120,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(q.x,q.y-10*z,58*z,0,Math.PI*2);ctx.fill()}drawEllipse(q.x,q.y+10*z,13*z,5*z,'rgba(32,45,33,.28)');ctx.fillStyle=equipped.includes('cloak')?'#9e4141':'#284b68';ctx.fillRect(q.x-8*z,q.y-20*z,16*z,27*z);drawEllipse(q.x,q.y-25*z,8*z,8*z,'#d3a17c');ctx.fillStyle='#d8c79e';ctx.beginPath();ctx.arc(q.x,q.y-28*z,10*z,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#e8c76b';ctx.beginPath();ctx.moveTo(q.x,q.y-18*z);ctx.lineTo(q.x+14*z,q.y-12*z);ctx.lineTo(q.x,q.y-6*z);ctx.fill()}
 // subtle vignette
 const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(13,30,31,.28)');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearest(){
 const choices=[
  {kind:'shepherd',x:shepherd.x,y:shepherd.y,dist:distance(player,shepherd)},
  {kind:'inn',x:inn.x,y:inn.y,dist:distance(player,inn)},
  {kind:'market',x:market.x,y:market.y,dist:distance(player,market)},
  {kind:'manger',x:manger.x,y:manger.y,dist:distance(player,manger)}
 ];
 scrollItems.forEach((item,index)=>{if(!item.got)choices.push({kind:'scroll',x:item.x,y:item.y,dist:distance(player,item),index})});
 return choices.sort((a,b)=>a.dist-b.dist)[0];
}
function setHint(){
 const n=nearest();
 if(n&&n.dist<65){
  $('hint').textContent=n.kind==='shepherd'?'Tap TALK / INTERACT to speak with the shepherd.':n.kind==='inn'?'Tap TALK / INTERACT to enter the inn and hear a welcome.':n.kind==='market'?'Tap TALK / INTERACT to browse goods at the Bethlehem Market.':n.kind==='manger'?(quizDone&&scrolls>=3?'Chapter 2 awaits: tap to visit the manger.':'Finish the shepherd quest and collect all 3 scrolls to unlock the manger.'):'Tap TALK / INTERACT to collect a Scripture scroll.';
 }else $('hint').textContent='Explore the hillside. Use the arrows to move.';
}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').style.display='none',1700)}
function openCard(content){interacting=true;$('card').innerHTML=content;$('overlay').style.display='flex'}
function closeCard(){interacting=false;$('overlay').style.display='none'}
function startQuiz(){
 openCard(`<div class="eyebrow">Shepherds' hillside · Luke 2:8–20</div><h2>Good news in Bethlehem</h2><p>The shepherd has heard a wondrous announcement. Answer this question to continue your journey.</p><p><strong>According to Luke 2, who brought the good news to the shepherds?</strong></p><div id="answers"></div><p id="feedback" aria-live="polite"></p><div class="bottomrow"><button class="secondary" id="leave">Not now</button></div>`);
 const answers=[['A choir of temple singers',false],['An angel of the Lord',true],['A Roman messenger',false]];
 const holder=$('answers');
 answers.forEach(([label,correct])=>{let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{if(quizDone){$('feedback').textContent='You have already completed this question. Keep exploring!';return}if(correct){b.classList.add('correct');$('feedback').textContent='Correct! Luke 2:9 says an angel of the Lord stood by them. +25 XP';xp+=25;quizDone=true;questDone=true;save();updateHud();setTimeout(()=>{closeCard();toast('Quest complete! +25 XP');},1100)}else{b.classList.add('wrong');$('feedback').textContent='Not quite. Read Luke 2:9 and try again.'}};holder.appendChild(b)});
 $('leave').onclick=closeCard;
}
function openMarket(){
 const goods=[
  {id:'lantern',name:'Traveler’s Lantern',icon:'🏮',price:15,desc:'A warm glow follows you through the hills.'},
  {id:'cloak',name:'Festival Cloak',icon:'🧥',price:25,desc:'A rich red cloak for your traveler.'},
  {id:'boots',name:'Swift Traveler Boots',icon:'🥾',price:30,desc:'Move 20% faster while exploring.'}
 ];
 const rows=goods.map(g=>{const owned=inventory.includes(g.id);return `<div style="border:1px solid #d4c9af;border-radius:14px;padding:12px;margin:9px 0;background:#fffaf0"><div style="font-size:18px">${g.icon} <strong>${g.name}</strong></div><p style="margin:5px 0;font-size:13px">${g.desc}</p><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>✨ ${g.price} XP</strong><button data-buy="${g.id}" ${owned||xp<g.price?'disabled':''} style="border:0;border-radius:10px;padding:10px 12px;background:${owned?'#ded3bc':xp<g.price?'#ded3bc':'#203a42'};color:${owned||xp<g.price?'#716958':'white'};font-weight:700">${owned?'Owned':xp<g.price?'Need more XP':'Buy item'}</button></div></div>`}).join('');
 openCard(`<div class="eyebrow">Bethlehem · Trading post</div><h2>Welcome to the Market</h2><p>Spend your earned XP on useful travel gear. Purchases are saved with your journey.</p><p><strong>Your balance: ✨ <span id="marketBalance">${xp}</span> XP</strong></p>${rows}<p id="marketMessage" aria-live="polite"></p><div class="bottomrow"><button id="marketClose">Back to the road</button></div>`);
 document.querySelectorAll('[data-buy]').forEach(btn=>btn.onclick=()=>{const g=goods.find(item=>item.id===btn.dataset.buy);if(!g||inventory.includes(g.id))return;if(xp<g.price){$('marketMessage').textContent='You need more XP for that item.';return}xp-=g.price;inventory.push(g.id);equipped.push(g.id);save();openMarket();$('marketMessage').textContent=`Purchased ${g.name}! Enjoy your new gear.`});
 $('marketClose').onclick=closeCard;
}
function startChapterTwo(){
 openCard(`<div class="eyebrow">Chapter 2 · Luke 2:12–16</div><h2>A Sign in the Manger</h2><p>You follow the star to Bethlehem. Inside the humble stable, Mary and Joseph care for the newborn child. The shepherds' announcement has led you to the sign they were given.</p><p><strong>Question:</strong> What sign did the angel tell the shepherds to look for?</p><div id="chapterAnswers"></div><p id="chapterFeedback" aria-live="polite"></p><div class="bottomrow"><button class="secondary" id="chapterLeave">Read later</button></div>`);
 const answers=[['A child lying in a manger',true],['A royal crown in a palace',false],['A new star inside the temple',false]];const holder=$('chapterAnswers');
 answers.forEach(([label,correct])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{if(mangerDone){$('chapterFeedback').textContent='You have completed this chapter. Keep exploring Bethlehem!';return}if(correct){b.classList.add('correct');$('chapterFeedback').textContent='Correct! Luke 2:12 describes the sign. +30 XP';xp+=30;mangerDone=true;questDone=true;save();setTimeout(()=>{closeCard();openCard(`<div class="eyebrow">Chapter 2 complete</div><h2>Good news, shared with wonder</h2><p>The shepherds found Mary, Joseph, and the child, just as they had been told. Their journey turned a message into a meeting, and they left sharing what they had seen and heard.</p><p><strong>Scripture to read:</strong> Luke 2:12–16</p><p><strong>Reflection:</strong> What small sign might help you recognize hope in an unexpected place?</p><p><strong>Reward:</strong> 30 XP · Chapter 2 recorded in your journal.</p><div class="bottomrow"><button id="chapterDone">Continue exploring</button></div>`);$('chapterDone').onclick=closeCard;},900)}else{b.classList.add('wrong');$('chapterFeedback').textContent='Not quite. Read Luke 2:12 and try again.'}};holder.appendChild(b)});$('chapterLeave').onclick=closeCard;
}
function openInventory(){
 const gear=[
  {id:'lantern',icon:'🏮',name:'Traveler’s Lantern',price:15,category:'Light',effect:'A warm golden glow follows you through the hills.',bonus:'Adds a soft golden glow around your character.',compare:'Light and visibility effect. It does not change movement speed or outfit color.'},
  {id:'cloak',icon:'🧥',name:'Festival Cloak',price:25,category:'Appearance',effect:'Your traveler’s robe turns rich red while equipped.',bonus:'Changes the robe color from blue to red.',compare:'Cosmetic upgrade. It does not affect movement speed or the lantern glow.'},
  {id:'boots',icon:'🥾',name:'Swift Traveler Boots',price:30,category:'Movement',effect:'Move 20% faster while equipped.',bonus:'Increases walking and running speed by 20%.',compare:'Movement upgrade. It does not change robe color or add a glow.'}
 ];
 let compareId=gear.find(g=>inventory.includes(g.id))?.id||'lantern';
 function render(){
  const owned=gear.filter(g=>inventory.includes(g.id));
  const selected=gear.find(g=>g.id===compareId)||gear[0];
  const slots=Array.from({length:inventorySlotCount},(_,i)=>{
   const id=inventory[i];
   if(!id)return '<div style="border:1px dashed #b9aa8d;border-radius:12px;padding:12px;text-align:center;min-height:86px;background:rgba(255,250,240,.55)"><div style="font-size:24px;opacity:.55">＋</div><div style="font-size:11px;font-weight:800">OPEN SLOT</div><div style="font-size:10px;color:#80745e">Future discovery</div></div>';
   const g=gear.find(item=>item.id===id);
   return '<div style="border:1px solid #cbbd9f;border-radius:12px;padding:12px;text-align:center;min-height:86px;background:#fffaf0"><div style="font-size:25px">'+(g?g.icon:'🎁')+'</div><div style="font-size:11px;font-weight:800">'+(g?g.name:id)+'</div><div style="font-size:10px;color:#6e6758">'+(equipped.includes(id)?'Equipped':'Stored')+'</div></div>';
  }).join('');
  const items=gear.map(g=>{
   const ownedItem=inventory.includes(g.id),active=equipped.includes(g.id);
   return '<div style="border:1px solid #d4c9af;border-radius:14px;padding:12px;margin:9px 0;background:#fffaf0"><div style="display:flex;gap:10px;align-items:flex-start"><div style="font-size:28px">'+g.icon+'</div><div style="flex:1"><strong>'+g.name+'</strong><p style="font-size:12px;margin:5px 0">'+g.effect+'</p><div style="font-size:11px;font-weight:800;color:'+(active?'#315b38':'#776b57')+'">'+(ownedItem?(active?'✓ EQUIPPED':'IN PACK'):'NOT OWNED')+'</div></div></div><div style="display:flex;gap:7px;margin-top:10px"><button data-compare="'+g.id+'" style="flex:1;border:1px solid #b9aa8d;border-radius:9px;padding:9px;background:'+(compareId===g.id?'#f5e3b7':'#fffaf0')+';color:#21343a;font-weight:700">Compare</button>'+(ownedItem?'<button data-toggle="'+g.id+'" style="flex:1;border:0;border-radius:9px;padding:9px;background:#203a42;color:white;font-weight:700">'+(active?'Unequip':'Equip')+'</button>':'<button disabled style="flex:1;border:0;border-radius:9px;padding:9px;background:#ded3bc;color:#716958;font-weight:700">'+g.price+' XP at market</button>')+'</div></div>';
  }).join('');
  const comparison='<div style="border:1px solid #d4c9af;border-radius:14px;padding:13px;margin-top:12px;background:#fffaf0"><div class="eyebrow">Gear comparison</div><strong>'+selected.icon+' '+selected.name+'</strong><p style="font-size:13px;margin:6px 0">'+selected.bonus+'</p><p style="font-size:12px;margin:6px 0"><strong>Category:</strong> '+selected.category+'</p><p style="font-size:12px;margin:6px 0">'+selected.compare+'</p><div style="border-top:1px solid #e0d5c0;margin-top:9px;padding-top:9px;font-size:12px"><strong>Current active bonuses</strong><p style="margin:5px 0">'+(equipped.length?gear.filter(g=>equipped.includes(g.id)).map(g=>g.icon+' '+g.name+': '+g.bonus).join('<br>'):'No gear bonuses active. Equip an item to use its effect.')+'</p></div></div>';
  $('card').innerHTML='<div class="eyebrow">Your travel gear</div><h2>Inventory</h2><p>✨ XP balance: <strong>'+xp+'</strong> · Gear owned: <strong>'+inventory.length+'/'+inventorySlotCount+'</strong></p><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0">'+slots+'</div><p style="font-size:12px;color:#655b49">Tap Equip or Unequip to change active effects. Your gear and choices save with your journey.</p>'+items+comparison+'<div class="bottomrow"><button id="inventoryClose">Back to the road</button></div>';
  $('inventoryClose').onclick=closeCard;
  document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{
   const id=btn.dataset.toggle;
   if(!inventory.includes(id))return;
   if(equipped.includes(id))equipped=equipped.filter(item=>item!==id);else equipped.push(id);
   save();render();
  });
  document.querySelectorAll('[data-compare]').forEach(btn=>btn.onclick=()=>{compareId=btn.dataset.compare;render()});
 }
 openCard('');
 render();
}
function openInnWelcome(){
 openCard(`<div class="eyebrow">A safe place on the road</div><h2>Welcome to the Inn</h2><p>You step out from the inn into the hills of Bethlehem, ready to meet fellow travelers and discover the good news.</p><p><strong>Innkeeper:</strong> May your road be peaceful, and may you carry kindness wherever you go.</p><div class="bottomrow"><button id="ok">Begin the journey</button></div>`);
 $('ok').onclick=closeCard;
}
function interact(){
 if(interacting)return;
 const n=nearest();
 if(!n||n.dist>70){toast('Move closer to a person or scroll.');return;}
 if(n.kind==='inn'){openInnWelcome();return;}
 if(n.kind==='market'){openMarket();return;}
 if(n.kind==='manger'){
  if(!quizDone||scrolls<3){toast('Complete the shepherd quest and collect all 3 scrolls first.');return;}
  if(mangerDone){openCard(`<div class="eyebrow">Chapter 2 · Luke 2:12–16</div><h2>The Manger in Bethlehem</h2><p>You have visited the place the shepherds were told to seek. The story reminds us that hope can arrive in humble surroundings.</p><p><strong>Reflection:</strong> Where might you find hope in an unexpected place?</p><div class="bottomrow"><button id="ok">Continue exploring</button></div>`);$('ok').onclick=closeCard;return;}
  startChapterTwo();return;
 }
 if(n.kind==='shepherd'){
  if(quizDone){
   openCard(`<div class="eyebrow">Luke 2:8–20</div><h2>Peace and good news</h2><p>The shepherds went to Bethlehem and shared what they had been told. The story invites us to respond with wonder, gratitude, and hope.</p><p><strong>Scripture to read:</strong> Luke 2:8–20</p><div class="bottomrow"><button id="ok">Continue exploring</button></div>`);
   $('ok').onclick=closeCard;
  }else startQuiz();
  return;
 }
 const item=scrollItems[n.index];
 if(!item||item.got)return;
 item.got=true;scrolls++;xp+=5;save();toast('Scripture scroll collected! +5 XP');
 if(scrolls>=3){
  openCard(`<div class="eyebrow">Chapter 1 complete</div><h2>Three scrolls collected!</h2><p>You have gathered every scroll scattered across the hillside. Your next destination is the manger in Bethlehem.</p><p><strong>Chapter 2 unlocked:</strong> Follow the star and discover the sign described in Luke 2:12–16.</p><div class="bottomrow"><button id="ok">Continue exploring</button></div>`);
  $('ok').onclick=closeCard;
 }
}
$('interact').addEventListener('click',interact);
$('run').addEventListener('click',()=>{running=!running;$('run').textContent=running?'🏃 RUNNING':'🏃 WALK';toast(running?'Running enabled':'Walking enabled')});

$('inventory').addEventListener('click',openInventory);
function openJournal(){
 const notes=[
  {title:'The Angel’s Announcement',ref:'Luke 2:9–10',text:'An angel of the Lord appears to the shepherds, announcing good news and great joy for all the people.',reflection:'What kind of news brings you hope when life feels uncertain?'},
  {title:'A Sign for the Shepherds',ref:'Luke 2:11–12',text:'The shepherds are told they will find a baby wrapped in cloths and lying in a manger.',reflection:'Why might an ordinary, humble sign carry extraordinary meaning?'},
  {title:'Wonder Shared with Others',ref:'Luke 2:15–20',text:'The shepherds go to Bethlehem, see what has happened, and share what they have been told.',reflection:'What good news or kindness could you share with someone else?'}
 ];
 const chapters=[
  {title:'The Shepherds’ Announcement',ref:'Luke 2:8–20',done:quizDone,summary:'Meet the shepherd and learn about the angel’s announcement of good news.',reward:'25 XP · Shepherd quiz'},
  {title:'A Sign in the Manger',ref:'Luke 2:12–16',done:mangerDone,summary:'Follow the star to Bethlehem and discover the sign given to the shepherds.',reward:'30 XP · Manger quiz'}
 ];
 const stamp=done=>done?'<span style="display:inline-block;border:2px solid #47754b;color:#315b38;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:900;letter-spacing:.08em;transform:rotate(-3deg)">✓ QUEST COMPLETE</span>':'<span style="display:inline-block;border:1px solid #b9aa8d;color:#776b57;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800">NOT YET COMPLETE</span>';
 const chapterCards=chapters.map((ch,i)=>'<div style="border:1px solid #d4c9af;border-radius:14px;padding:13px;margin:9px 0;background:#fffaf0"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div style="font-size:10px;font-weight:800;letter-spacing:.1em;color:#8b6322">CHAPTER '+(i+1)+'</div><strong>'+ch.title+'</strong></div><div style="font-size:24px">'+(ch.done?'📜':'🔒')+'</div></div><p style="font-size:12px;margin:7px 0">'+ch.summary+'</p><p style="font-size:11px;margin:5px 0"><strong>Scripture:</strong> '+ch.ref+'</p><p style="font-size:11px;margin:8px 0">'+stamp(ch.done)+'</p><div style="font-size:11px;color:#655b49">'+(ch.done?'Reward recorded: '+ch.reward:'Reward: '+ch.reward)+'</div></div>').join('');
 const collected=notes.filter((n,i)=>scrollItems[i]&&scrollItems[i].got);
 const noteCards=collected.length?collected.map(n=>'<div style="border-left:4px solid #c39b4b;padding:10px 12px;margin:10px 0;background:#fffaf0;border-radius:0 12px 12px 0"><div style="font-size:10px;color:#8b6322;font-weight:800;letter-spacing:.08em">SCRIPTURE NOTE</div><strong>'+n.title+'</strong><div style="font-size:11px;color:#655b49;margin-top:3px">'+n.ref+'</div><p style="font-size:13px;margin:7px 0">'+n.text+'</p><p style="font-size:12px;margin:6px 0"><strong>Reflect:</strong> '+n.reflection+'</p></div>').join(''):'<div style="border:1px dashed #b9aa8d;border-radius:14px;padding:18px;text-align:center;background:#fffaf0"><div style="font-size:30px">📜</div><strong>No Scripture notes collected yet</strong><p style="font-size:13px">Explore the hillside and collect the three glowing scrolls. Each one adds a note to this journal.</p></div>';
 openCard('<div class="eyebrow">A record of your journey</div><h2>Traveler’s Journal</h2><p style="font-size:13px">Your story, completed quests, and Scripture discoveries, gathered in one place.</p><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:14px 0"><div style="background:#e8dfc9;border-radius:10px;padding:10px;text-align:center"><div style="font-size:19px">⭐</div><strong>'+xp+'</strong><div style="font-size:10px">XP earned</div></div><div style="background:#e8dfc9;border-radius:10px;padding:10px;text-align:center"><div style="font-size:19px">📜</div><strong>'+scrolls+'/3</strong><div style="font-size:10px">Scrolls found</div></div><div style="background:#e8dfc9;border-radius:10px;padding:10px;text-align:center"><div style="font-size:19px">🏅</div><strong>'+chapters.filter(ch=>ch.done).length+'/2</strong><div style="font-size:10px">Quests stamped</div></div></div><div class="eyebrow" style="margin-top:16px">Chapter entries</div>'+chapterCards+'<div class="eyebrow" style="margin-top:18px">Collected Scripture notes · '+collected.length+'/3</div>'+noteCards+'<div style="border-top:1px solid #d4c9af;margin-top:16px;padding-top:12px;font-size:11px;color:#655b49">Your journal updates as you complete quests and collect scrolls. Progress is saved on this device.</div><div class="bottomrow"><button id="journalClose">Close journal</button></div>');
 $('journalClose').onclick=closeCard;
}
$('journal').addEventListener('click',openJournal);
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeCard()});
document.querySelectorAll('.ctrl').forEach(btn=>{const dir=btn.dataset.dir;const down=e=>{e.preventDefault();keys[dir]=true};const up=e=>{e.preventDefault();keys[dir]=false};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('pointerleave',up)});
addEventListener('keydown',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=true;if(['ArrowDown','s','S'].includes(e.key))keys.down=true;if(['ArrowLeft','a','A'].includes(e.key))keys.left=true;if(['ArrowRight','d','D'].includes(e.key))keys.right=true;if(e.key===' '||e.key==='Enter'){e.preventDefault();interact()}});
addEventListener('keyup',e=>{if(['ArrowUp','w','W'].includes(e.key))keys.up=false;if(['ArrowDown','s','S'].includes(e.key))keys.down=false;if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});
function frame(t){let dt=Math.min((t-last)/16.67||1,2);last=t;if(!interacting){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);if(dx||dy){let mag=Math.hypot(dx,dy);const pace=player.speed*(equipped.includes('boots')?1.2:1)*(running?1.75:1);player.x=clamp(player.x+dx/mag*pace*dt,35,world.w-35);player.y=clamp(player.y+dy/mag*pace*dt,55,world.h-25);player.dir=Math.atan2(dy,dx);if(Math.random()<.035)save()}}draw();drawMiniMap();setHint();requestAnimationFrame(frame)}
updateHud();
if(!Object.keys(saved).length){openInnWelcome();}
requestAnimationFrame(frame);
})();
</script>

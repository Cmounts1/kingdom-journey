<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#203b42">
<title>Kingdom Journey | 3D Bible Adventure</title>
<style>
:root{color-scheme:dark;--cream:#fff3d7;--gold:#f5cc72;--panel:rgba(22,39,42,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b6d8c5;font-family:Georgia,"Times New Roman",serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none;color:var(--cream)}
.topbar{position:absolute;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand,.hint,.toast{background:var(--panel);border:1px solid #fff3d744;border-radius:15px;padding:10px 13px;box-shadow:0 5px 20px #142d2d30;backdrop-filter:blur(8px)}
.brand strong{display:block;font-size:17px;letter-spacing:.04em;color:var(--gold)}
.brand span{font-size:12px;opacity:.88}
.hint{max-width:220px;font-size:13px;line-height:1.35}
#message{position:absolute;top:23%;left:50%;transform:translateX(-50%);width:min(90%,440px);text-align:center;background:var(--panel);border:1px solid #f5cc7280;border-radius:18px;padding:16px 18px;display:none;box-shadow:0 12px 35px #18333050}
#message h2{margin:0 0 7px;color:var(--gold);font-size:23px}
#message p{margin:0;line-height:1.45;font-size:15px}
 #stats{position:absolute;top:76px;left:12px;display:flex;gap:7px;flex-wrap:wrap;max-width:calc(100% - 24px);font:12px system-ui,sans-serif}
 .stat,#quest{background:var(--panel);border:1px solid #fff3d744;border-radius:12px;padding:8px 10px;box-shadow:0 5px 20px #142d2d25}
 #quest{position:absolute;top:120px;left:12px;max-width:min(290px,calc(100% - 24px));font:12px/1.35 system-ui,sans-serif}
 #quest strong{display:block;color:var(--gold);margin-bottom:3px;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
 #overlay{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:18px;background:#101f24a8;pointer-events:auto}
 #card{width:min(100%,520px);max-height:min(82dvh,760px);overflow:auto;background:#fff3d7;color:#263b3b;border:2px solid #c49a4b;border-radius:20px;padding:20px;box-shadow:0 18px 55px #101f2488;font:15px/1.45 system-ui,sans-serif;touch-action:pan-y}
 #card h2{font: bold 25px Georgia,serif;margin:5px 0 10px;color:#263b3b}
 #card p{margin:9px 0}
 #card .eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#8b6322}
 #card button{border:0;border-radius:12px;padding:11px 13px;background:#203b42;color:#fff3d7;font-weight:800;font-size:14px;touch-action:manipulation}
 #card button.secondary{background:#ded3bc;color:#263b3b}
 #card button:disabled{opacity:.45}
 #card .choice{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;background:#fffaf0;color:#263b3b;border:1px solid #c9b991}
 #card .bottomrow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:16px}
 #toast{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:none;max-width:85%;text-align:center;font:bold 14px system-ui,sans-serif;z-index:9}
 

#controls{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:auto}
#stickZone{width:132px;height:132px;border-radius:50%;background:#1a353b55;border:2px solid #fff3d777;position:relative;touch-action:none;box-shadow:0 5px 20px #1a353b25}
#stick{position:absolute;width:54px;height:54px;left:37px;top:37px;border-radius:50%;background:#f5cc72dd;border:2px solid #fff3d7;box-shadow:0 3px 10px #142d2d55;pointer-events:none}
.rightControls{display:flex;flex-direction:column;align-items:center;gap:10px}
.controlButton{border:1px solid #fff3d7aa;background:#1a353bd9;color:var(--cream);border-radius:18px;padding:13px 16px;font: bold 14px Georgia,serif;box-shadow:0 5px 18px #142d2d30;min-width:100px;touch-action:manipulation}
.controlButton:active{transform:translateY(2px);background:#34575a}
#interact{background:#8a6125eF;color:#fff5df;border-color:#ffe2a1;min-width:112px}
#footer{position:absolute;bottom:calc(160px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font:12px system-ui,sans-serif;color:#173a3a;background:#f8f0d9cc;border-radius:20px;padding:6px 10px;white-space:nowrap}
@media(min-width:760px){#controls{padding:0 28px 14px}#stickZone{opacity:.72}#footer{bottom:18px;left:auto;right:28px;transform:none}.hint{max-width:280px}}
@media(max-height:520px){#stickZone{width:100px;height:100px}#stick{left:25px;top:25px;width:46px;height:46px}#footer{display:none}.controlButton{padding:9px 12px}}
</style>
</head>
<body>
<div id="hud">
  <div class="topbar">
    <div class="brand"><strong>✦ KINGDOM JOURNEY</strong><span>3D Bible adventure · Bethlehem</span></div>
    <div class="hint" id="hint">Choose your path, then explore Bethlehem.</div>
  </div>
  <div id="stats"><div class="stat">⭐ Level <b id="level">1</b></div><div class="stat">✨ XP <b id="xp">0</b></div><div class="stat">📜 Scrolls <b id="scrolls">0</b>/3</div></div>
  <div id="quest"><strong>Current Quest</strong><span id="questText">Meet the shepherd and hear the announcement.</span></div>
  <div id="message"><h2>Welcome, traveler</h2><p>The innkeeper’s lantern is lit.</p></div>
  <div id="controls">
    <div id="stickZone" aria-label="Movement joystick"><div id="stick"></div></div>
    <div class="rightControls">
      <button class="controlButton" id="interact">Talk / Interact</button>
      <button class="controlButton" id="run">🏃 Walk</button>
      <button class="controlButton" id="inventory">🎒 Inventory</button>
      <button class="controlButton" id="journal">📖 Journal</button>
      <button class="controlButton" id="reset">Reset View ↻</button>
    </div>
  </div>
  <div id="footer">Desktop: WASD / arrow keys · Mobile: drag the gold joystick</div>
</div>
<div id="overlay"><div id="card"></div></div>
<div id="toast" class="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color('#b7d8c7');
scene.fog = new THREE.Fog('#b7d8c7', 24, 62);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 150);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight('#fff2d4','#526b58',2.0));
const sun = new THREE.DirectionalLight('#fff0cb',2.6);
sun.position.set(-9,16,7); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;
scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness});
const materials={
 grass:mat('#83ad79'), grass2:mat('#a5c88b'), path:mat('#cbb58c'), stone:mat('#9e9b83'),
 wall:mat('#e5cda0'), wallShade:mat('#c4a77c'), wood:mat('#6c4934'), darkWood:mat('#3d3029'),
 roof:mat('#8c5140'), roofLight:mat('#ad6950'), trim:mat('#f4e4bd'), leaf:mat('#477c58'),
 leaf2:mat('#67945e'), trunk:mat('#79543a'), gold:mat('#ffc75e'), cloth:mat('#9f4b3e'),
 skin:mat('#dca77c'), hair:mat('#49382f'), trousers:mat('#526b72'), boot:mat('#47362e')
};
function mesh(geo,material,x,y,z, parent=scene){const m=new THREE.Mesh(geo,material);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m}
function box(w,h,d,material,x,y,z,parent=scene){return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z,parent)}
function cylinder(rt,rb,h,material,x,y,z,segments=8,parent=scene){return mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material,x,y,z,parent)}
function sphere(r,material,x,y,z,parent=scene,detail=0){return mesh(new THREE.IcosahedronGeometry(r,detail),material,x,y,z,parent)}

const ground=box(120,.35,120,materials.grass,0,-.24,0);ground.receiveShadow=true;
// Soft rolling hills, made from low-poly mounds.
for(let i=0;i<13;i++){const x=(i%5-2)*13+(Math.random()-.5)*4,z=-17-Math.floor(i/5)*13;const h=2+Math.random()*3;const hill=sphere(1, i%3?materials.grass2:materials.grass,x,h*.35,z,scene,1);hill.scale.set(7+Math.random()*3,h,5+Math.random()*3);hill.castShadow=false;}
// A winding sandy approach.
const path=box(4,.08,23,materials.path,0,.0,2);path.rotation.y=-.12;
for(let i=0;i<12;i++){const s=box(.38,.09,.55,materials.stone,Math.sin(i*.8)*.65,.06,11-i*1.7);s.rotation.y=(i%2-.5)*.2;}
// Inn shell with a real doorway, visible floor and furnished interior.
box(8.8,.18,4.8,materials.wood,0,.02,-7);
box(9,4.5,.22,materials.wall,0,2.25,-9.42);
box(.22,4.5,4.9,materials.wall,-4.4,2.25,-7);
box(.22,4.5,4.9,materials.wall,4.4,2.25,-7);
box(3.25,4.5,.22,materials.wall,-2.875,2.25,-4.55);
box(3.25,4.5,.22,materials.wall,2.875,2.25,-4.55);
box(2.5,1.25,.22,materials.wall,0,3.88,-4.55);
box(9.35,.22,5.3,materials.wood,0,4.42,-7);
const roof1=mesh(new THREE.ConeGeometry(6.1,3.3,4),materials.roof,0,5.75,-7);
roof1.rotation.y=Math.PI/4;roof1.scale.set(1.05,1,.72);
const innDoor=box(1.05,2.65,.12,materials.darkWood,.78,1.35,-4.45);innDoor.rotation.y=-.62;
box(2.2,.22,.25,materials.wood,0,3.12,-4.38);
box(.1,2.7,.1,materials.gold,0,1.7,-4.28);
for(const x of [-3.1,3.1]){
 box(1.25,1.35,.14,materials.wood,x,2.6,-4.35);
 box(.95,1.05,.1,materials.gold,x,2.62,-4.25);
 box(1.05,.09,.12,materials.trim,x,2.62,-4.18);
 box(.09,1.1,.12,materials.trim,x,2.62,-4.18);
}
for(const x of [-4.1,4.1])box(.22,4.7,.28,materials.wood,x,2.35,-4.32);
// Furnished common room: counter, benches, rug, shelves and a glowing hearth.
box(3.1,.18,.72,materials.wood,0,1.05,-8.85);
for(const x of [-1.35,0,1.35])box(.13,.95,.13,materials.darkWood,x,.53,-8.58);
box(2.2,.12,.65,materials.wood,-2.45,.82,-6.75);
box(2.2,.12,.65,materials.wood,2.45,.82,-6.75);
box(1.45,.12,.85,materials.roofLight,0,.14,-6.5);
for(const x of [-3.5,3.5]){
 box(.12,1.35,.12,materials.darkWood,x,1.05,-8.8);
 box(1.05,.12,.28,materials.wood,x,1.55,-8.8);
 box(1.05,.12,.28,materials.wood,x,1.05,-8.8);
}
box(1.15,.15,.65,materials.stone,0,.15,-8.95);
box(.62,.38,.18,materials.darkWood,0,.45,-9.02);
const hearthGlow=new THREE.PointLight('#ff9a45',1.2,4);hearthGlow.position.set(0,1,-8.5);scene.add(hearthGlow);
// Porch awning and posts.
box(4.7,.18,1.5,materials.wood,0,3.55,-3.85);
for(const x of [-2.15,2.15])cylinder(.09,.12,3.3,materials.wood,x,1.9,-3.25,8);
const sign=box(2.4,.65,.12,materials.wood,0,4.15,-3.5);
box(2.15,.42,.04,materials.trim,0,4.15,-3.41);
box(.1,.25,.06,materials.gold,0,4.15,-3.36);
// Lanterns and warm light.
for(const x of [-2.7,2.7]){
  box(.12,.65,.12,materials.darkWood,x,3.1,-3.85);
  const lamp=box(.35,.42,.32,materials.gold,x,2.8,-3.85);
  const glow=new THREE.PointLight('#ffbd58',1.3,5);glow.position.set(x,2.7,-3.7);scene.add(glow);
}
// Side barrels, crates, flower beds.
for(const [x,z] of [[-5,-4],[5,-4],[-5,-9],[5,-9]]){
  cylinder(.42,.5,.9,materials.wood,x,.45,z,9);
  cylinder(.43,.43,.09,materials.darkWood,x,.3,z,9);
  cylinder(.43,.43,.09,materials.darkWood,x,.65,z,9);
}
for(let i=0;i<18;i++){
 const x=(i%2?1:-1)*(6.2+Math.random()*2),z=-2-Math.random()*13;
 const stem=cylinder(.04,.06,.6,materials.leaf,x,.3,z,5);
 sphere(.2, i%2?materials.leaf:materials.leaf2,x,.7,z,scene,1);
}
// Stylized trees.
function tree(x,z,size=1){
 cylinder(.22*size,.32*size,1.8*size,materials.trunk,x,.9*size,z,7);
 const a=sphere(1.05*size,materials.leaf,x,2.0*size,z,scene,1);a.scale.set(1,1.15,.95);
 const b=sphere(.75*size,materials.leaf2,x+.42*size,2.5*size,z-.12*size,scene,1);
}
[[-10,-5],[-12,-13],[10,-8],[12,-17],[-8,-20],[7,3],[14,1]].forEach((p,i)=>tree(p[0],p[1],.8+(i%3)*.18));
// Small enterable cottages with door openings and simple furnishings.
function cottage(x,z,scale=1){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);g.scale.setScalar(scale);
 box(2.7,.14,2.4,materials.wood,0,.02,0,g);
 box(3,2.4,.16,materials.wallShade,0,1.2,-1.27,g);
 box(.16,2.4,2.7,materials.wallShade,-1.42,1.2,0,g);
 box(.16,2.4,2.7,materials.wallShade,1.42,1.2,0,g);
 box(1.02,2.4,.16,materials.wallShade,-.99,1.2,1.27,g);
 box(1.02,2.4,.16,materials.wallShade,.99,1.2,1.27,g);
 box(.96,.72,.16,materials.wallShade,0,2.04,1.27,g);
 const r=mesh(new THREE.ConeGeometry(2.35,1.6,4),materials.roof,0,3,0,g);r.rotation.y=Math.PI/4;r.scale.z=.8;
 const door=box(.72,1.55,.09,materials.darkWood,.47,.78,1.34,g);door.rotation.y=-.55;
 box(1.0,.18,1.25,materials.wood,-.72,.42,-.48,g);
 box(.9,.12,1.05,materials.trim,-.72,.54,-.48,g);
 box(.85,.55,.55,materials.wood,.72,.38,-.48,g);
 box(1.05,.12,.22,materials.wood,0,1.55,-1.13,g);
}
cottage(-13,-1,.9);cottage(14,-3,.8);cottage(12,-25,1.15);
const buildings=[
 {name:'The Inn at Bethlehem',x:0,z:-7,doorX:0,doorZ:-4.05,insideX:0,insideZ:-6.65,kind:'inn'},
 {name:'The Wayfarer’s Cottage',x:-13,z:-1,doorX:-13,doorZ:.14,insideX:-13,insideZ:-1,kind:'cottage',scale:.9},
 {name:'The Shepherd’s Cottage',x:14,z:-3,doorX:14,doorZ:-1.98,insideX:14,insideZ:-3,kind:'cottage',scale:.8},
 {name:'The Hillside Cottage',x:12,z:-25,doorX:12,doorZ:-23.54,insideX:12,insideZ:-25,kind:'cottage',scale:1.15}
];
// The wider 3D world mirrors the 2D journey landmarks and collectibles.
const worldObjects={
 shepherd:{x:7,z:-14},
 market:{x:-10,z:2},
 manger:{x:11,z:-20.5},
 scrolls:[{x:-8,z:-7,got:false},{x:8,z:-9,got:false},{x:-3,z:-18,got:false}],
 sideNpcs:{
  traveler:{x:-15,z:-6,name:'Mara the Wayfinder'},
  helper:{x:-10,z:5,name:'Eli the Baker'},
  seeker:{x:4,z:-18,name:'Natan the Scroll Keeper'}
 },
 sideItems:{
  traveler:{x:-11,z:-10,name:'bronze road marker',icon:'🪧'},
  helper:{x:-5,z:7,name:'basket of fresh bread',icon:'🥖'},
  seeker:{x:1,z:-14,name:'torn parchment clue',icon:'📜'}
 }
};
const worldDecor=new THREE.Group();scene.add(worldDecor);
function signBoard(x,z,labelColor=materials.gold){
 const post=cylinder(.055,.07,1.2,materials.wood,x,.6,z,7,worldDecor);
 const board=box(.9,.48,.12,materials.darkWood,x,1.35,z,worldDecor);
 box(.72,.28,.025,labelColor,x,1.35,z+.075,worldDecor);
 return board;
}
// Bethlehem market stall and colorful goods.
box(3,.16,1.8,materials.wood,-10,.12,2,worldDecor);
for(const x of [-11.25,-10,-8.75])cylinder(.06,.07,2.15,materials.wood,x,1.08,2,7,worldDecor);
box(3.2,.14,1.9,materials.roofLight,-10,2.18,2,worldDecor);
for(const x of [-11,-10,-9]){
 sphere(.18,materials.gold,x,.48,1.65,worldDecor,1);
 box(.35,.32,.32,materials.leaf,x,.42,2.15,worldDecor);
}
signBoard(-10,3.1,materials.trim);
// Stable and manger, lit by the star.
box(4,.18,3,materials.wood,11,.08,-20.5,worldDecor);
box(4,2.4,.18,materials.wallShade,11,1.2,-22,worldDecor);
box(.18,2.4,3,materials.wallShade,9,1.2,-20.5,worldDecor);
box(.18,2.4,3,materials.wallShade,13,1.2,-20.5,worldDecor);
const stableRoof=mesh(new THREE.ConeGeometry(3.1,1.8,4),materials.roof,11,3,-20.5,worldDecor);stableRoof.rotation.y=Math.PI/4;stableRoof.scale.z=.8;
box(1.35,.45,.55,materials.wood,11, .42,-20.1,worldDecor);
box(1.12,.12,.42,materials.trim,11,.68,-20.1,worldDecor);
const starShape=new THREE.Shape();
for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?0.22:0.5,x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)starShape.moveTo(x,y);else starShape.lineTo(x,y)}
starShape.closePath();
const star=mesh(new THREE.ShapeGeometry(starShape),new THREE.MeshBasicMaterial({color:'#ffe58a',side:THREE.DoubleSide}),11,5,-20.2,worldDecor);
const starLight=new THREE.PointLight('#ffe58a',1.7,8);starLight.position.set(11,4.7,-19.5);worldDecor.add(starLight);
// Decorative paths lead between the story locations.
function pathStone(x,z){const s=box(.55,.07,.7,materials.stone,x,.05,z,worldDecor);s.rotation.y=.12}
for(let i=0;i<9;i++){pathStone(-.9-i*.8,-5-i*1.1);pathStone(1+i*.7,-12-i*.8)}

// Player: more natural storybook traveler with layered clothing and articulated limbs.
const player=new THREE.Group();scene.add(player);player.position.set(0,0,7);
const body=new THREE.Group();player.add(body);
const skinMat=new THREE.MeshStandardMaterial({color:'#d7a078',roughness:.86});
const skinShadow=new THREE.MeshStandardMaterial({color:'#b97d5b',roughness:.9});
const tunicMat=new THREE.MeshStandardMaterial({color:'#5c7c70',roughness:.95});
const tunicLight=new THREE.MeshStandardMaterial({color:'#78988a',roughness:.92});
const leatherMat=new THREE.MeshStandardMaterial({color:'#69432d',roughness:.88});
const leatherLight=new THREE.MeshStandardMaterial({color:'#8d5d3c',roughness:.84});
const linenMat=new THREE.MeshStandardMaterial({color:'#d8c8a5',roughness:1});
const hairMat=new THREE.MeshStandardMaterial({color:'#4b3025',roughness:1});
const eyeMat=new THREE.MeshStandardMaterial({color:'#30251f',roughness:.7});
const metalMat=new THREE.MeshStandardMaterial({color:'#c5a15d',metalness:.35,roughness:.5});
function smoothSphere(rx,ry,rz,material,x,y,z,parent=body){
 const m=mesh(new THREE.SphereGeometry(1,16,12),material,x,y,z,parent);
 m.scale.set(rx,ry,rz);return m;
}
function limb(radiusTop,radiusBottom,length,material,x,y,z,rotX=0,rotZ=0,parent=body){
 const m=mesh(new THREE.CylinderGeometry(radiusTop,radiusBottom,length,10),material,x,y,z,parent);
 m.rotation.x=rotX;m.rotation.z=rotZ;return m;
}
// Tunic, collar and belt.
mesh(new THREE.CylinderGeometry(.31,.39,.88,12),tunicMat,0,1.08,0,body);
smoothSphere(.34,.20,.23,tunicMat,0,1.43,0);
limb(.115,.13,.17,linenMat,0,1.51,-.015,0,0,body);
mesh(new THREE.CylinderGeometry(.345,.345,.085,12),leatherMat,0,.82,0,body);
box(.13,.105,.045,metalMat,0,.82,-.355,body);
// Neck, face, ears and hair.
limb(.105,.11,.17,skinMat,0,1.61,0,0,0,body);
smoothSphere(.255,.315,.235,skinMat,0,1.91,-.015);
smoothSphere(.23,.17,.225,hairMat,0,2.12,.005);
smoothSphere(.105,.15,.20,hairMat,-.19,1.98,.015);
smoothSphere(.105,.15,.20,hairMat,.19,1.98,.015);
smoothSphere(.045,.07,.035,skinMat,-.255,1.91,0);
smoothSphere(.045,.07,.035,skinMat,.255,1.91,0);
// Face points toward -Z.
smoothSphere(.045,.052,.035,eyeMat,-.09,1.95,-.224);
smoothSphere(.045,.052,.035,eyeMat,.09,1.95,-.224);
smoothSphere(.055,.07,.065,skinShadow,0,1.87,-.245);
smoothSphere(.10,.045,.035,skinShadow,0,1.79,-.219);
// Soft travel cap with a stitched-looking band.
smoothSphere(.265,.13,.25,leatherMat,0,2.19,.005);
const capBand=mesh(new THREE.TorusGeometry(.245,.025,6,16),leatherLight,0,2.16,0,body);
capBand.rotation.x=Math.PI/2;

function setJoy(e){
 const r=zone.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=(e.clientX-cx)/(r.width*.32),dy=(e.clientY-cy)/(r.height*.32);
 const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 joyX=dx;joyY=dy;stick.style.transform=`translate(${dx*29}px,${dy*29}px)`;
}

 const slots=Array.from({length:8},(_,i)=>inventory[i]?'🎒 '+(gear.find(g=>g.id===inventory[i])||{}).name:'Empty slot');
 const items=gear.map(g=>{const owned=inventory.includes(g.id),active=equipped.includes(g.id);return '<div style="border:1px solid #d4c9af;border-radius:12px;padding:10px;margin:8px 0;background:#fffaf0"><strong>'+g.icon+' '+g.name+'</strong><p>'+g.desc+'</p><div>'+(owned?(active?'✓ EQUIPPED':'In pack'):'Not owned')+'</div><div class="bottomrow">'+(owned?'<button data-toggle="'+g.id+'">'+(active?'Unequip':'Equip')+'</button>':'<button disabled>'+g.price+' XP at market</button>')+'</div></div>'}).join('');
 openCard('<div class="eyebrow">Your travel gear</div><h2>Inventory</h2><p>✨ XP balance: <strong>'+xp+'</strong> · Gear owned: '+inventory.length+'/8</p><div>'+slots.map(s=>'<div style="padding:4px 0;border-bottom:1px solid #d4c9af">'+s+'</div>').join('')+'</div>'+items+'<div class="bottomrow"><button class="secondary" id="inventoryClose">Back to the road</button></div>');
 document.querySelectorAll('[data-toggle]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.toggle;if(equipped.includes(id))equipped=equipped.filter(x=>x!==id);else equipped.push(id);if(id==='cloak')tunicMat.color.set(equipped.includes('cloak')?'#9e4141':'#5c7c70');if(id==='lantern')lanternGlow.visible=equipped.includes('lantern');save();openInventory()});
 $('inventoryClose').onclick=closeCard;
}
function openJournal(){
 const q=sideQuestDefs[journeyPath];
 const side=q?'<div style="border:1px solid #d4c9af;border-radius:12px;padding:12px;margin:10px 0"><strong>'+q.questTitle+'</strong><p>'+(sideQuestDone?'✓ Completed':sideQuestStarted?(sideQuestStep===0?'In progress: find '+q.itemName+'.':q.returnText):'Not started: speak with '+q.npcName+'.')+'</p><p><strong>Reward:</strong> '+q.reward+' XP · '+q.keepsake+'</p>'+(keepsakes.length?'<p><strong>Keepsakes earned:</strong> '+keepsakes.join(', ')+'</p>':'')+'</div>':'';
 const scrollNames=['The Angel’s Announcement · Luke 2:9–10','A Sign for the Shepherds · Luke 2:11–12','Wonder Shared with Others · Luke 2:15–20'];
 const notes=scrollNames.map((n,i)=>gotScrolls[i]?'<li>'+n+'</li>':'').join('');
 openCard('<div class="eyebrow">A record of your journey</div><h2>Traveler’s Journal</h2><p>Your story, completed quests, Scripture discoveries, and keepsakes.</p>'+side+'<p><strong>Level:</strong> '+(1+Math.floor(xp/50))+' · <strong>XP:</strong> '+xp+' · <strong>Scrolls:</strong> '+scrolls+'/3</p><p><strong>Chapter 1 · The Shepherds’ Announcement:</strong> '+(quizDone?'✓ Complete, 25 XP earned':'Not yet complete')+'</p><p><strong>Chapter 2 · A Sign in the Manger:</strong> '+(mangerDone?'✓ Complete, 30 XP earned':'Locked until the shepherd quiz and all three scrolls are collected')+'</p><div class="eyebrow">Collected Scripture notes</div>'+(notes?'<ul>'+notes+'</ul>':'<p>No scrolls collected yet. Search the hillside for three scrolls.</p>')+'<div class="bottomrow"><button id="journalClose">Close journal</button></div>');
 $('journalClose').onclick=closeCard;
}
function chooseJourneyPath(){
 const paths=[
 {id:'traveler',icon:'🧭',name:'The Traveler',tag:'Follow the road',text:'Walk the roads of Bethlehem, meet the people in the story, gather Scripture, and follow the star to the manger.',goal:'Explore landmarks and experience the biblical story firsthand.'},
 {id:'helper',icon:'🤝',name:'The Helper',tag:'Serve along the way',text:'Pay attention to the people you meet. Learn the good news, gather the scrolls, and carry hope and kindness through Bethlehem.',goal:'Make helping others and sharing hope the heart of your journey.'},
 {id:'seeker',icon:'🔎',name:'The Mystery Seeker',tag:'Follow the clues',text:'Search for scattered scrolls, connect their messages, and uncover why everyone is talking about a child in a manger.',goal:'Treat every scroll and conversation as a clue in a larger mystery.'}
 ];
 openCard('<div class="eyebrow">Your adventure begins</div><h2>Choose your path</h2><p>Every path follows the same biblical story, but your purpose changes how you experience it.</p>'+paths.map(p=>'<button class="choice" data-path="'+p.id+'"><strong>'+p.icon+' '+p.name+'</strong><div style="font-size:11px;font-weight:800;color:#8b6322;margin:4px 0">'+p.tag+'</div><div>'+p.text+'</div><div style="font-size:11px;margin-top:7px"><strong>Your focus:</strong> '+p.goal+'</div></button>').join(''));
 document.querySelectorAll('[data-path]').forEach(btn=>btn.onclick=()=>{journeyPath=btn.dataset.path;save();closeCard();updateHud();toast('Path chosen: '+paths.find(p=>p.id===journeyPath).name)});
}
function interact(){
 if(overlay.style.display==='flex')return;
 if(entered&&currentBuilding){
  const b=currentBuilding;entered=false;currentBuilding=null;
  if(b.kind==='inn')roof1.visible=true;
  player.position.set(b.doorX,0,b.doorZ+1.0);player.rotation.y=0;cameraOffset.set(0,5.2,9.5);
  message.style.display='none';return;
 }
 const entrance=closestEntrance();
 if(entrance){entered=true;currentBuilding=entrance;player.position.set(entrance.insideX,0,entrance.insideZ);player.rotation.y=Math.PI;if(entrance.kind==='inn')roof1.visible=false;cameraOffset.set(0,2.65,-2.45);message.style.display='none';return}
 const n=nearestThing();
 if(!n||n.dist>2.65){toast('Move closer to a person, scroll, market, or doorway.');return}
 if(n.kind==='shepherd'){
  if(journeyPath==='helper'&&sideQuestStarted&&!sideQuestDone&&sideQuestStep===1){completeSideQuest();return}
  if(quizDone){openCard('<div class="eyebrow">Luke 2:8–20</div><h2>Peace and good news</h2><p>The shepherds went to Bethlehem and shared what they had been told.</p><p><strong>Scripture to read:</strong> Luke 2:8–20</p><div class="bottomrow"><button id="shepherdClose">Continue</button></div>');$('shepherdClose').onclick=closeCard}else startShepherdQuiz();return;
 }
 if(n.kind==='pathNpc'){offerSideQuest();return}
 if(n.kind==='questItem'){
  const q=sideQuestDefs[journeyPath];sideQuestStep=1;questItemMeshes[journeyPath].visible=false;save();
  const found=journeyPath==='traveler'?'You spot the bronze marker tucked beside the path.':journeyPath==='helper'?'You find Eli’s basket of fresh bread resting beside the road.':'You uncover a torn parchment fragment with a few mysterious words still visible.';
  openCard('<div class="eyebrow">Side quest discovery</div><h2>'+q.itemName+' found!</h2><p>'+found+'</p><p><strong>Next:</strong> '+(journeyPath==='helper'?'Take the bread to the shepherd on the hillside.':'Bring the item back to '+q.npcName+'.')+'</p><div class="bottomrow"><button id="questItemClose">Continue</button></div>');$('questItemClose').onclick=closeCard;return;
 }
 if(n.kind==='scroll'){
  if(gotScrolls[n.index])return;gotScrolls[n.index]=true;scrolls++;xp+=5;scrollMeshes[n.index].visible=false;save();
  toast((journeyPath==='seeker'?'Clue discovered!':journeyPath==='helper'?'Good news gathered!':'Scripture scroll collected!')+' +5 XP');
  if(scrolls>=3){openCard('<div class="eyebrow">Chapter 1 complete</div><h2>Three scrolls collected!</h2><p>You have gathered every scroll scattered across the hillside. Your next destination is the manger in Bethlehem.</p><p><strong>Chapter 2 unlocked:</strong> Follow the star and discover the sign described in Luke 2:12–16.</p><div class="bottomrow"><button id="scrollsClose">Continue exploring</button></div>');$('scrollsClose').onclick=closeCard}return;
 }
 if(n.kind==='market'){openMarket();return}
 if(n.kind==='manger'){
  if(!quizDone||scrolls<3){toast('Complete the shepherd quest and collect all 3 scrolls first.');return}
  if(mangerDone){openCard('<div class="eyebrow">Chapter 2 · Luke 2:12–16</div><h2>The Manger in Bethlehem</h2><p>You have visited the place the shepherds were told to seek. The story reminds us that hope can arrive in humble surroundings.</p><p><strong>Reflection:</strong> Where might you find hope in an unexpected place?</p><div class="bottomrow"><button id="mangerClose">Continue exploring</button></div>');$('mangerClose').onclick=closeCard;return}
  startChapterTwo();return;
 }
}
interactButton.addEventListener('click',interact);
$('inventory').addEventListener('click',openInventory);$('journal').addEventListener('click',openJournal);
$('run').addEventListener('click',()=>{running=!running;$('run').textContent=running?'🏃 Running':'🏃 Walk'});

// Lightweight collision rules keep the traveler on the path and out of solid scenery.
const solidRects=[
 {x:0,z:-9.55,hx:4.65,hz:.28},
 {x:-4.65,z:-7,hx:.28,hz:2.6},{x:4.65,z:-7,hx:.28,hz:2.6},
 {x:-2.85,z:-4.5,hx:1.65,hz:.28},{x:2.85,z:-4.5,hx:1.65,hz:.28},
 {x:-5,z:-4,hx:.65,hz:.65},{x:5,z:-4,hx:.65,hz:.65},
 {x:-5,z:-9,hx:.65,hz:.65},{x:5,z:-9,hx:.65,hz:.65},
 {x:-13,z:-2.15,hx:1.35,hz:.08},{x:-14.28,z:-1,hx:.08,hz:1.2},{x:-11.72,z:-1,hx:.08,hz:1.2},
 {x:-13.89,z:.14,hx:.25,hz:.08},{x:-12.11,z:.14,hx:.25,hz:.08},
 {x:14,z:-4.02,hx:1.2,hz:.08},{x:12.86,z:-3,hx:.08,hz:1.05},{x:15.14,z:-3,hx:.08,hz:1.05},
 {x:13.21,z:-1.98,hx:.20,hz:.08},{x:14.79,z:-1.98,hx:.20,hz:.08},
 {x:12,z:-26.46,hx:1.7,hz:.10},{x:10.37,z:-25,hx:.10,hz:1.55},{x:13.63,z:-25,hx:.10,hz:1.55},
 {x:10.86,z:-23.54,hx:.25,hz:.10},{x:13.14,z:-23.54,hx:.25,hz:.10}
];
const solidCircles=[[-10,-5,.9],[-12,-13,1], [10,-8,1],[12,-17,1],[-8,-20,.9],[7,3,.9],[14,1,1.0]];
function blockedAt(x,z){
 for(const r of solidRects){
  if(Math.abs(x-r.x)<r.hx+.28 && Math.abs(z-r.z)<r.hz+.25)return true;
 }
 for(const [tx,tz,r] of solidCircles){
  if(Math.hypot(x-tx,z-tz)<r+.32)return true;
 }
 return false;
}
const lanternGlow=new THREE.PointLight('#ffdc78',1.1,5);lanternGlow.position.set(0,1.3,0);body.add(lanternGlow);lanternGlow.visible=equipped.includes('lantern');
const clock=new THREE.Clock();
const desiredCamera=new THREE.Vector3();
const cameraOffset=new THREE.Vector3(0,5.2,9.5);
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 let x=(keys.has('a')||keys.has('arrowleft')?-1:0)+(keys.has('d')||keys.has('arrowright')?1:0)+joyX;
 let z=(keys.has('w')||keys.has('arrowup')?-1:0)+(keys.has('s')||keys.has('arrowdown')?1:0)+joyY;
 const len=Math.hypot(x,z);
 if(len>.12){
  x/=Math.max(1,len);z/=Math.max(1,len);
  const speed=4.1*(equipped.includes('boots')?1.2:1)*(running?1.75:1);
  const nextX=THREE.MathUtils.clamp(player.position.x+x*speed*dt,-18,18);
  const nextZ=THREE.MathUtils.clamp(player.position.z+z*speed*dt,-24,16);
  // Resolve axes separately so the player can slide along walls instead of sticking.
  if(!blockedAt(nextX,player.position.z))player.position.x=nextX;
  if(!blockedAt(player.position.x,nextZ))player.position.z=nextZ;
  const angle=Math.atan2(-x,-z);
  player.rotation.y=THREE.MathUtils.damp(player.rotation.y,angle,12,dt);
   const gait=Math.sin(clock.elapsedTime*10);
   body.position.y=Math.abs(gait)*.025;
   leftLeg.rotation.x=gait*.48;rightLeg.rotation.x=-gait*.48;
   leftArm.rotation.x=-gait*.34;rightArm.rotation.x=gait*.34;
  }else{
   body.position.y=THREE.MathUtils.damp(body.position.y,0,8,dt);
   leftLeg.rotation.x=THREE.MathUtils.damp(leftLeg.rotation.x,0,8,dt);
   rightLeg.rotation.x=THREE.MathUtils.damp(rightLeg.rotation.x,0,8,dt);
   leftArm.rotation.x=THREE.MathUtils.damp(leftArm.rotation.x,0,8,dt);
   rightArm.rotation.x=THREE.MathUtils.damp(rightArm.rotation.x,0,8,dt);
  }
 // Keep the action label honest: entry only activates near the doorway.
 const near=closestEntrance(),nearThing=nearestThing();
  interactButton.textContent=entered?'Leave Building':near?'Enter Building':(nearThing&&nearThing.dist<2.65?'Talk / Interact':'Explore');
  // Fixed-angle follow camera: it tracks the traveler but never pans or rotates while walking.
  desiredCamera.copy(player.position).add(cameraOffset);
  camera.position.copy(desiredCamera);
  camera.lookAt(player.position.x,1.2,player.position.z);
 renderer.render(scene,camera);
}
camera.position.set(0,5,15);updateHud();if(!journeyPath)chooseJourneyPath();animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));});
</script>
